<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>join my dungeonz 98 raid</title>
<!-- an invite link lands here and goes straight on to the lobby. it exists for
     the preview: a chat app reads these tags without running any script, and
     the desktop's own page can only ever describe the whole site. -->
<meta name="description" content="a co-op raid for up to four in a windows 98 window: rooms of minions, shrines with cards, and a boss at the end. bots take the empty seats. nothing to install, the link drops you in the lobby.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3a1d6e">
<meta property="og:type" content="website">
<meta property="og:site_name" content="mrhakan's shithole">
<meta property="og:title" content="join my dungeonz 98 raid">
<meta property="og:description" content="a co-op raid for up to four in a windows 98 window: rooms of minions, shrines with cards, and a boss at the end. bots take the empty seats. nothing to install, the link drops you in the lobby.">
<meta property="og:url" content="https://mrhakan.github.io/join/dungeonz/">
<meta property="og:image" content="https://mrhakan.github.io/join/dungeonz/preview.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="dungeonz 98: four wizards in a glowing dungeon room">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="48x48" href="../../src/emoj/favicon-48.png">
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #008080; font: 14px Tahoma, 'MS Sans Serif', sans-serif; }
.box { background: #c0c0c0; border: 2px solid; border-color: #fff #404040 #404040 #fff; padding: 3px; min-width: 260px; }
.bar { background: linear-gradient(90deg, #000080, #1084d0); color: #fff; font-weight: bold; padding: 3px 6px; }
.in { padding: 14px; color: #000; }
a { color: #000080; }
</style>
<script>
// ?lobby=ABCDE on to the desktop, which opens the lobby (js/web.js). No code
// is still worth a visit: it opens the game.
(function () {
    var code = (new URLSearchParams(location.search).get('lobby') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
    location.replace('../../' + (code.length >= 4 ? '?lobby=' + code : '?app=dungeonz'));
})();
</script>
</head>
<body>
<div class="box">
    <div class="bar">dungeonz 98</div>
    <div class="in">joining the lobby... <a id="go" href="../../?app=dungeonz">click here</a> if nothing happens.</div>
</div>
</body>
</html>
