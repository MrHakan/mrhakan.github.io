<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><title>Bridge Logic 98</title><meta name="description" content="Connect numbered islands with bridges in a compact daily Hashi-style logic puzzle."><link rel="canonical" href="https://mrhakan.github.io/games/bridge-logic/"><meta property="og:title" content="Bridge Logic 98"><meta property="og:description" content="A daily island-and-bridges logic puzzle."><meta property="og:type" content="website"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080}body{min-height:100vh;display:grid;place-items:center;padding:10px}.win{width:min(680px,100%);background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:7px 7px #004040;padding:3px}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:6px;display:flex;justify-content:space-between}.title a{color:#000;background:#c0c0c0;text-decoration:none;padding:0 6px;border:2px solid;border-color:#fff #444 #444 #fff}.body{padding:10px}.hud{display:flex;gap:6px;flex-wrap:wrap}.box,.status{background:#fff;border:2px inset #ddd;padding:7px;font:12px monospace}.board{display:grid;grid-template-columns:repeat(7,1fr);aspect-ratio:1;margin:10px auto;max-width:520px;background:#fff;border:3px inset #ddd;position:relative}.cell{position:relative;display:grid;place-items:center}.island{z-index:2;width:70%;aspect-ratio:1;border-radius:50%;background:#ffffc0;border:2px solid #000;font:bold clamp(12px,4vw,22px) monospace;display:grid;place-items:center;cursor:pointer}.island.ok{background:#b6ffb6}.bridge{position:absolute;background:#000;z-index:1;pointer-events:none}.h{height:3px;left:50%;width:100%}.v{width:3px;top:50%;height:100%}.double.h{height:7px;border-top:2px solid #000;border-bottom:2px solid #000;background:transparent}.double.v{width:7px;border-left:2px solid #000;border-right:2px solid #000;background:transparent}.btn{background:#c0c0c0;border:2px solid;border-color:#fff #444 #444 #fff;padding:7px 12px;font-weight:bold}.status{margin-top:8px;min-height:34px}.help{font-size:12px;line-height:1.4}/* Playground focus visibility */:where(a,button,.island):focus-visible{outline:2px solid #f0f;outline-offset:2px}@media(max-width:480px){body{padding:4px}.body{padding:6px}.board{width:100%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</head><body><main class="win"><div class="title"><h1 class="page-heading">🌉 BRIDGE LOGIC 98.EXE</h1><a href="../../" aria-label="Back to Playground">×</a></div><div class="body"><div class="hud"><div class="box">DAILY #<b id="day"></b></div><div class="box">MOVES <b id="moves">0</b></div></div><div id="board" class="board" aria-label="Bridge puzzle board"></div><button type="button" class="btn" id="reset">RESET</button><div id="status" class="status" aria-live="polite">Connect islands until every number matches its bridge count.</div><p class="help">Click one island, then another visible island in the same row or column. Click the pair again for two bridges, and a third time to remove them. Bridges may not cross.</p></div></main><script>(()=>{'use strict';const B=document.getElementById('board'),S=document.getElementById('status'),M=document.getElementById('moves');const layouts=[[[0,1,2],[0,5,2],[2,1,3],[2,5,3],[4,1,3],[4,5,3],[6,1,2],[6,5,2]],[[0,0,2],[0,3,3],[0,6,1],[3,0,3],[3,3,4],[3,6,3],[6,0,1],[6,3,3],[6,6,2]],[[0,2,2],[0,5,2],[2,0,2],[2,2,4],[2,5,3],[4,0,2],[4,2,3],[4,5,3],[6,2,2],[6,5,2]]];let islands=[],links=new Map(),sel=null,moves=0;const day=Math.floor(Date.now()/86400000);document.getElementById('day').textContent=day%10000;function init(){B.innerHTML='';links.clear();sel=null;moves=0;M.textContent=0;islands=layouts[day%layouts.length].map((x,i)=>({r:x[0],c:x[1],n:x[2],i}));for(let r=0;r<7;r++)for(let c=0;c<7;c++){const cell=document.createElement('div');cell.className='cell';cell.dataset.r=r;cell.dataset.c=c;const x=islands.find(q=>q.r===r&&q.c===c);if(x){const b=document.createElement('button');b.type='button';b.className='island';b.textContent=x.n;b.setAttribute('aria-label',`Island ${x.n} at row ${r+1}, column ${c+1}`);b.onclick=()=>pick(x);cell.appendChild(b)}B.appendChild(cell)}paint();S.textContent='Connect islands until every number matches its bridge count.'}function key(a,b){return [a.i,b.i].sort((x,y)=>x-y).join('-')}function visible(a,b){if(a.r!==b.r&&a.c!==b.c)return false;return !islands.some(x=>x.i!==a.i&&x.i!==b.i&&((a.r===b.r&&x.r===a.r&&x.c>Math.min(a.c,b.c)&&x.c<Math.max(a.c,b.c))||(a.c===b.c&&x.c===a.c&&x.r>Math.min(a.r,b.r)&&x.r<Math.max(a.r,b.r))))}function pick(x){if(sel===null){sel=x;S.textContent='First island selected. Choose a visible island in the same row or column.';return}if(sel.i===x.i){sel=null;S.textContent='Selection cleared.';return}if(!visible(sel,x)){S.textContent='Those islands cannot connect directly.';sel=x;return}const k=key(sel,x),v=(links.get(k)||0)+1;links.set(k,v%3);moves++;M.textContent=moves;sel=null;paint();check()}function count(x){let n=0;for(const [k,v] of links)if(k.split('-').map(Number).includes(x.i))n+=v;return n}function paint(){[...B.children].forEach(c=>{c.querySelectorAll('.bridge').forEach(e=>e.remove());const x=islands.find(q=>q.r==c.dataset.r&&q.c==c.dataset.c),b=c.querySelector('.island');if(b&&x)b.classList.toggle('ok',count(x)===x.n)});for(const [k,v] of links){if(!v)continue;const [ia,ib]=k.split('-').map(Number),a=islands[ia],b=islands[ib],dr=Math.sign(b.r-a.r),dc=Math.sign(b.c-a.c);let r=a.r+dr,c=a.c+dc;while(r!==b.r||c!==b.c){const cell=B.children[r*7+c],e=document.createElement('span');e.className='bridge '+(dr?'v':'h')+(v===2?' double':'');cell.appendChild(e);r+=dr;c+=dc}}}function check(){if(islands.every(x=>count(x)===x.n))S.textContent=`Solved in ${moves} moves! Daily bridge network complete.`}document.getElementById('reset').onclick=init;init()})();</script></body></html>
