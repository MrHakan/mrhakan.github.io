<title>Shutdown Sequence 98</title><style>:root{font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080}*{box-sizing:border-box}body{margin:0;padding:10px;min-height:100vh;background:#008080}.win{max-width:760px;margin:auto;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:5px 5px #004040}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:5px;display:flex}.title a{margin-left:auto;color:#000;background:#c0c0c0;text-decoration:none;border:2px solid;border-color:#fff #000 #000 #fff;padding:0 6px}.hud{display:flex;gap:6px;flex-wrap:wrap;padding:8px}.box,.btn{border:2px solid;border-color:#fff #000 #000 #fff;background:#c0c0c0;padding:7px;font-weight:bold}.box{font:12px monospace}.screen{margin:0 8px 8px;background:#000080;color:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:18px;text-align:center;min-height:110px;display:grid;place-items:center}.screen strong{font-size:20px}.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px}.pad{min-height:145px;border:3px solid;border-color:#fff #000 #000 #fff;font:bold 18px "MS Sans Serif";cursor:pointer;touch-action:manipulation}.pad:active,.pad.on{border-color:#000 #fff #fff #000;filter:brightness(1.45);transform:translate(1px,1px)}#p0{background:#b03030}#p1{background:#258a45}#p2{background:#3155a4}#p3{background:#b39a21}.controls{display:flex;gap:8px;padding:8px;justify-content:center}.btn{cursor:pointer;min-width:110px}.help{padding:0 10px 12px;font-size:11px;color:#333;text-align:center}@media(max-width:520px){body{padding:5px}.pad{min-height:110px}.screen{min-height:90px;padding:12px}.pads{gap:7px}.hud{padding:6px}.box{flex:1;text-align:center}}

</style></head><body><main class="win"><div class="title">🔌 SHUTDOWN SEQUENCE 98.EXE <a href="../../" aria-label="back">×</a></div><div class="hud"><div class="box">LEVEL <b id="level">0</b></div><div class="box">BEST <b id="best">0</b></div><div class="box">STATUS <b id="state">READY</b></div></div><div class="screen"><strong id="msg">Windows must remember the shutdown sequence.<br>Can you?</strong></div><div class="pads"><button class="pad" id="p0" aria-label="red">RED</button><button class="pad" id="p1" aria-label="green">GREEN</button><button class="pad" id="p2" aria-label="blue">BLUE</button><button class="pad" id="p3" aria-label="yellow">YELLOW</button></div><div class="controls"><button class="btn" id="start">START / RESTART</button></div><div class="help">Watch the flashing sequence, then repeat it. Keyboard: 1–4. Every level adds one step and speeds up. Best level is saved locally.</div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),pads=[0,1,2,3].map(i=>$('p'+i)),level=$('level'),bestEl=$('best'),state=$('state'),msg=$('msg');let seq=[],pos=0,accept=false,run=0,audio=null,best=0;try{best=+(localStorage.getItem('shutdown-sequence-best')||0)}catch(e){}bestEl.textContent=best;function tone(i,d=.13){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=[220,330,440,550][i];o.type='square';g.gain.value=.025;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}function flash(i,d=240){pads[i].classList.add('on');tone(i,d/1000*.7);setTimeout(()=>pads[i].classList.remove('on'),d)}async function show(){accept=false;state.textContent='WATCH';msg.textContent='Memorize…';const token=run,delay=Math.max(240,540-seq.length*18);await new Promise(r=>setTimeout(r,500));for(const i of seq){if(token!==run)return;flash(i,delay*.65);await new Promise(r=>setTimeout(r,delay))}if(token!==run)return;pos=0;accept=true;state.textContent='YOUR TURN';msg.textContent='Repeat '+seq.length+' step'+(seq.length===1?'':'s')+'.'}function next(){seq.push(Math.floor(Math.random()*4));level.textContent=seq.length;show()}function start(){run++;seq=[];pos=0;accept=false;msg.textContent='Starting…';next()}function press(i){if(!accept)return;flash(i,150);if(i!==seq[pos]){accept=false;state.textContent='FAILED';msg.innerHTML='Incorrect sequence.<br>You reached level <b>'+seq.length+'</b>.';if(seq.length-1>best){best=seq.length-1;bestEl.textContent=best;try{localStorage.setItem('shutdown-sequence-best',best)}catch(e){}}tone(0,.4);return}pos++;if(pos===seq.length){accept=false;if(seq.length>best){best=seq.length;bestEl.textContent=best;try{localStorage.setItem('shutdown-sequence-best',best)}catch(e){}}state.textContent='OK';msg.textContent='Sequence accepted. Next level…';setTimeout(next,650)}}pads.forEach((p,i)=>p.addEventListener('pointerdown',()=>press(i)));addEventListener('keydown',e=>{const i=['1','2','3','4'].indexOf(e.key);if(i>=0)press(i)});$('start').onclick=start})();</script></body></html>
