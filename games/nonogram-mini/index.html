<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><title>Nonogram Mini 98</title><meta name="description" content="Solve a compact seeded daily nonogram with row and column clues."><link rel="canonical" href="https://mrhakan.github.io/games/nonogram-mini/"><meta property="og:title" content="Nonogram Mini 98"><meta property="og:description" content="A tiny daily picture-logic puzzle with touch-friendly controls."><meta property="og:type" content="website"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080}body{min-height:100vh;display:grid;place-items:center;padding:8px}.win{width:min(620px,100%);background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:7px 7px #004040;padding:3px}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:6px;display:flex;justify-content:space-between}.title h1{margin:0;font:inherit}.title a{color:#000;background:#c0c0c0;text-decoration:none;padding:0 6px;border:2px solid;border-color:#fff #444 #444 #fff}.body{padding:12px}.hud,.actions{display:flex;gap:8px;flex-wrap:wrap}.box,.status{background:#fff;border:2px inset #ddd;padding:7px;font:13px monospace}.board{margin:14px auto;display:grid;grid-template-columns:70px repeat(5,minmax(42px,58px));grid-template-rows:70px repeat(5,minmax(42px,58px));width:max-content;max-width:100%}.corner{border-right:2px solid #444;border-bottom:2px solid #444}.clue{display:flex;align-items:center;justify-content:center;font:bold 13px monospace;text-align:center;padding:3px}.col{align-items:flex-end;padding-bottom:7px}.cell{border:1px solid #777;background:#fff;display:grid;place-items:center;font:bold 25px monospace;cursor:pointer;touch-action:manipulation}.cell.filled{background:#000080}.cell.marked::after{content:"×";color:#777}.btn{background:#c0c0c0;border:2px solid;border-color:#fff #444 #444 #fff;padding:8px 12px;font-weight:bold;cursor:pointer}.status{margin-top:10px;min-height:34px}.help{font-size:12px;line-height:1.45}:where(a,button):focus-visible{outline:2px solid #f0f;outline-offset:2px}@media(max-width:480px){body{padding:3px}.body{padding:7px}.board{grid-template-columns:52px repeat(5,minmax(38px,52px));grid-template-rows:52px repeat(5,minmax(38px,52px))}.clue{font-size:11px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main class="win"><div class="title"><h1>▦ NONOGRAM MINI 98.EXE</h1><a href="../../" aria-label="Back to Playground">×</a></div><div class="body"><div class="hud"><div class="box">DAILY #<b id="day"></b></div><div class="box">MOVES <b id="moves">0</b></div><div class="box">BEST <b id="best">—</b></div></div><div class="board" id="board" aria-label="5 by 5 nonogram puzzle"></div><div class="actions"><button type="button" class="btn" id="mode">MODE: FILL</button><button type="button" class="btn" id="reset">RESET</button></div><div class="status" id="status" aria-live="polite">Fill cells so each row and column matches its clues.</div><p class="help">Clues describe consecutive filled groups. Tap to fill; switch to MARK mode to place × notes. Keyboard: focus a cell and press Space to apply the current mode.</p></div></main><script>(()=>{'use strict';const D=Math.floor(Date.now()/86400000),patterns=[["01110","10001","10101","10001","01110"],["00100","01110","11111","01110","00100"],["10001","01010","00100","01010","10001"],["11011","11011","00000","11111","01110"],["01110","11111","10101","11111","01010"]],sol=patterns[D%patterns.length],state=Array.from({length:5},()=>Array(5).fill(0)),board=document.getElementById('board'),movesEl=document.getElementById('moves'),status=document.getElementById('status'),best=document.getElementById('best');let mode=1,moves=0;document.getElementById('day').textContent=D%10000;const key='nonogram-mini-'+D,b=localStorage.getItem(key);if(b)best.textContent=b+' moves';function clues(s){const a=[];let n=0;for(const x of s){if(x==='1')n++;else if(n){a.push(n);n=0}}if(n)a.push(n);return a.length?a.join(' '):'0'}function render(){board.innerHTML='<div class="corner"></div>';for(let c=0;c<5;c++)board.insertAdjacentHTML('beforeend','<div class="clue col">'+clues(sol.map(r=>r[c]).join(''))+'</div>');for(let r=0;r<5;r++){board.insertAdjacentHTML('beforeend','<div class="clue">'+clues(sol[r])+'</div>');for(let c=0;c<5;c++){const x=document.createElement('button');x.type='button';x.className='cell'+(state[r][c]===1?' filled':state[r][c]===2?' marked':'');x.setAttribute('aria-label',`row ${r+1}, column ${c+1}, ${state[r][c]===1?'filled':state[r][c]===2?'marked':'empty'}`);x.onclick=()=>play(r,c);board.appendChild(x)}}}function play(r,c){state[r][c]=state[r][c]===mode?0:mode;moves++;movesEl.textContent=moves;render();if(state.every((row,r)=>row.every((v,c)=>(v===1)===(sol[r][c]==='1')))){const old=Number(localStorage.getItem(key)||Infinity);if(moves<old){localStorage.setItem(key,moves);best.textContent=moves+' moves'}status.textContent='Picture complete! Daily nonogram solved in '+moves+' moves.'}}document.getElementById('mode').onclick=e=>{mode=mode===1?2:1;e.currentTarget.textContent='MODE: '+(mode===1?'FILL':'MARK');status.textContent=mode===1?'Fill mode selected.':'Mark mode selected; use × for known empty cells.'};document.getElementById('reset').onclick=()=>{state.forEach(r=>r.fill(0));moves=0;movesEl.textContent='0';status.textContent='Board reset.';render()};render()})();</script></body></html>
