<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><title>Hex Merge 98</title><meta name="description" content="Slide numbered hex tiles, merge matching values and chase a high score in a compact browser puzzle."><link rel="canonical" href="https://mrhakan.github.io/games/hex-merge/"><meta property="og:title" content="Hex Merge 98"><meta property="og:description" content="A compact six-direction merge puzzle with keyboard and touch controls."><meta property="og:type" content="website"><meta property="og:url" content="https://mrhakan.github.io/games/hex-merge/"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#008080;color:#000;font-family:"MS Sans Serif",Tahoma,Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:14px;background-image:radial-gradient(#ffffff22 1px,transparent 1px);background-size:9px 9px}.win{width:min(690px,100%);background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:7px 7px #004848;padding:3px}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:700;padding:7px;display:flex;justify-content:space-between}.title a{color:#000;background:#c0c0c0;text-decoration:none;padding:0 6px;border:2px solid;border-color:#fff #404040 #404040 #fff}.body{padding:12px}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.box{background:#fff;border:2px inset #ddd;padding:7px;font-size:11px}.box b{display:block;font:700 18px "Courier New",monospace}.board{margin:12px auto;max-width:520px;display:grid;gap:5px;touch-action:none}.row{display:flex;justify-content:center;gap:5px}.row:nth-child(even){transform:translateX(9%)}.tile{width:17%;aspect-ratio:1.08;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);background:#eee;display:grid;place-items:center;font:700 clamp(13px,4vw,24px) "Courier New",monospace;text-shadow:1px 1px #fff}.tile[data-v="0"]{background:#a8a8a8;color:transparent}.tile[data-v="2"]{background:#ffffe1}.tile[data-v="4"]{background:#ffe8a0}.tile[data-v="8"]{background:#ffc878}.tile[data-v="16"]{background:#ff9c70}.tile[data-v="32"]{background:#ff7474}.tile[data-v="64"]{background:#e978e9}.tile[data-v="128"],.tile[data-v="256"],.tile[data-v="512"],.tile[data-v="1024"],.tile[data-v="2048"]{background:#72d6ff}.controls{display:grid;grid-template-columns:repeat(3,48px);gap:4px;justify-content:center}.btn{background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:7px;font-weight:700;cursor:pointer;min-height:40px}.wide{width:100%;margin-top:8px}.status{background:#ffffe1;border:1px solid #808080;padding:8px;margin-top:9px;min-height:34px;font:12px "Courier New",monospace}.help{font-size:12px;line-height:1.45}.spacer{visibility:hidden}/* Playground focus visibility */:where(a,button,input,select,textarea,[tabindex]):focus-visible{outline:2px solid #ff00ff;outline-offset:2px}@media(max-width:520px){body{padding:7px}.body{padding:8px}.hud{grid-template-columns:1fr 1fr}.hud .box:last-child{grid-column:1/-1}.row{gap:3px}.controls{grid-template-columns:repeat(3,44px)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

</head><body><main class="win" aria-label="Hex Merge 98 game"><div class="title"><h1 class="page-heading">⬡ HEX MERGE 98.EXE</h1><a href="../../" aria-label="Back to Playground">×</a></div><div class="body"><div class="hud"><div class="box">SCORE<b id="score">0</b></div><div class="box">BEST<b id="best">0</b></div><div class="box">HIGHEST<b id="high">2</b></div></div><div id="board" class="board" role="grid" aria-label="Hex merge board"></div><div class="controls" aria-label="Move controls"><button type="button" class="btn" data-d="ul" aria-label="Move up left">↖</button><button type="button" class="btn" data-d="u" aria-label="Move up">↑</button><button type="button" class="btn" data-d="ur" aria-label="Move up right">↗</button><button type="button" class="btn" data-d="dl" aria-label="Move down left">↙</button><button type="button" class="btn" data-d="d" aria-label="Move down">↓</button><button type="button" class="btn" data-d="dr" aria-label="Move down right">↘</button></div><button type="button" class="btn wide" id="new">NEW GAME</button><div class="status" id="status" role="status" aria-live="polite">Merge equal tiles. Reach 2048 — or keep going.</div><p class="help">Keyboard: <b>Q/W/E</b> for the three upward directions and <b>A/S/D</b> for the three downward directions. On touch screens, swipe in any of the six directions. Progress is stored only in this browser.</p></div></main><script>(()=>{'use strict';const R=5,C=5,$=x=>document.getElementById(x),board=$('board');let g=Array.from({length:R},()=>Array(C).fill(0)),score=0;const bestKey='hex-merge-98-best';$('best').textContent=localStorage.getItem(bestKey)||'0';function empty(){const a=[];g.forEach((r,y)=>r.forEach((v,x)=>{if(!v)a.push([y,x])}));return a}function add(){const e=empty();if(!e.length)return;const [y,x]=e[Math.floor(Math.random()*e.length)];g[y][x]=Math.random()<.9?2:4}function lines(dir){const out=[];if(dir==='u'||dir==='d'){for(let x=0;x<C;x++)out.push(Array.from({length:R},(_,y)=>[y,x]))}else{const up=dir==='ul'||dir==='ur',right=dir==='ur'||dir==='dr';for(let k=0;k<R+C-1;k++){const line=[];for(let y=0;y<R;y++){let x=k-y;if(y%2)x+=right?1:0;if(x>=0&&x<C)line.push([y,x])}if(line.length)out.push(line)}if(!up)out.forEach(l=>l.reverse())}if(dir==='d')out.forEach(l=>l.reverse());return out}function move(dir){const before=JSON.stringify(g);for(const line of lines(dir)){const vals=line.map(([y,x])=>g[y][x]).filter(Boolean),m=[];for(let i=0;i<vals.length;i++){if(vals[i]===vals[i+1]){const v=vals[i]*2;m.push(v);score+=v;i++}else m.push(vals[i])}while(m.length<line.length)m.push(0);line.forEach(([y,x],i)=>g[y][x]=m[i])}if(JSON.stringify(g)!==before){add();render();if(!canMove())$('status').textContent='NO MORE MOVES — score '+score+'. Start a new game.'}}function canMove(){if(empty().length)return true;for(let y=0;y<R;y++)for(let x=0;x<C;x++)for(const [dy,dx] of [[1,0],[0,1],[1,1],[1,-1]]){const yy=y+dy,xx=x+dx;if(yy<R&&xx>=0&&xx<C&&g[y][x]===g[yy][xx])return true}return false}function render(){board.innerHTML='';let hi=2;g.forEach((r,y)=>{const row=document.createElement('div');row.className='row';row.setAttribute('role','row');r.forEach(v=>{hi=Math.max(hi,v);const t=document.createElement('div');t.className='tile';t.dataset.v=v;t.setAttribute('role','gridcell');t.setAttribute('aria-label',v?String(v):'empty');t.textContent=v||'0';row.appendChild(t)});board.appendChild(row)});$('score').textContent=score;$('high').textContent=hi;const b=Math.max(score,Number(localStorage.getItem(bestKey)||0));localStorage.setItem(bestKey,String(b));$('best').textContent=b}function fresh(){g=Array.from({length:R},()=>Array(C).fill(0));score=0;add();add();$('status').textContent='Merge equal tiles. Reach 2048 — or keep going.';render()}document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>move(b.dataset.d)));$('new').addEventListener('click',fresh);const keys={q:'ul',w:'u',e:'ur',a:'dl',s:'d',d:'dr',ArrowUp:'u',ArrowDown:'d'};addEventListener('keydown',e=>{const d=keys[e.key]||keys[e.key.toLowerCase?.()];if(d){e.preventDefault();move(d)}});let sx=0,sy=0;board.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;board.setPointerCapture?.(e.pointerId)});board.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)<24)return;const ang=Math.atan2(dy,dx)*180/Math.PI;move(ang<-120?'ul':ang<-60?'u':ang<0?'ur':ang<60?'dr':ang<120?'d':'dl')});fresh()})();</script></body></html>
