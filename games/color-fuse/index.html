<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><title>Color Fuse 98</title><meta name="description" content="Clear connected color clusters, chain combos and chase a high score in a quick retro puzzle."><link rel="canonical" href="https://mrhakan.github.io/games/color-fuse/"><meta property="og:title" content="Color Fuse 98"><meta property="og:description" content="A fast local cluster-clearing puzzle for mouse and touch."><meta property="og:type" content="website"><meta property="og:url" content="https://mrhakan.github.io/games/color-fuse/"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080}body{min-height:100vh;display:grid;place-items:center;padding:12px}.win{width:min(680px,100%);background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:7px 7px #004040;padding:3px}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:6px 8px;display:flex;justify-content:space-between}.title a{color:#000;background:#c0c0c0;text-decoration:none;padding:0 6px;border:2px solid;border-color:#fff #444 #444 #fff}.body{padding:12px}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.meter{background:#fff;border:2px inset #ddd;padding:7px;font-size:11px}.meter b{display:block;font:700 18px monospace}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:10px auto;max-width:520px;background:#808080;padding:6px;border:2px inset #ddd}.cell{aspect-ratio:1;border:2px solid;border-color:#fff #444 #444 #fff;cursor:pointer}.c0{background:#ff4040}.c1{background:#ffe040}.c2{background:#30c060}.c3{background:#4080ff}.c4{background:#c050d0}.btn{background:#c0c0c0;border:2px solid;border-color:#fff #444 #444 #fff;padding:7px 12px;font-weight:bold;min-height:36px}.status{margin-top:8px;background:#ffffe1;border:1px solid #808080;padding:8px;font:12px monospace;min-height:34px}.help{font-size:12px;line-height:1.4}/* Playground focus visibility */:where(a,button):focus-visible{outline:2px solid #f0f;outline-offset:2px}@media(max-width:520px){body{padding:5px}.body{padding:8px}.board{gap:2px;padding:4px}.hud{grid-template-columns:1fr 1fr}.hud .meter:last-child{grid-column:1/-1}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</head><body><main class="win"><div class="title"><h1 class="page-heading">◆ COLOR FUSE 98.EXE</h1><a href="../../" aria-label="Back to Playground">×</a></div><div class="body"><div class="hud"><div class="meter">SCORE<b id="score">0</b></div><div class="meter">BEST<b id="best">0</b></div><div class="meter">COMBO<b id="combo">x1</b></div></div><div id="board" class="board" role="grid" aria-label="Color Fuse eight by eight board"></div><button type="button" class="btn" id="new">NEW BOARD</button><div id="status" class="status" role="status" aria-live="polite">Clear connected groups of 2 or more matching colors.</div><p class="help">Tap a connected color cluster. Bigger groups score quadratically; consecutive clears of 5+ build a combo. Columns collapse when emptied.</p></div></main><script>(()=>{'use strict';const W=8,H=8,C=5,el=document.getElementById('board'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),comboEl=document.getElementById('combo'),status=document.getElementById('status');let grid=[],score=0,combo=1;const key='color-fuse-best';let best=+(localStorage.getItem(key)||0);bestEl.textContent=best;function fresh(){grid=Array.from({length:H},()=>Array.from({length:W},()=>Math.floor(Math.random()*C)));score=0;combo=1;render()}function group(x,y){const v=grid[y]?.[x];if(v==null)return[];const out=[],seen=new Set(),q=[[x,y]];while(q.length){const [a,b]=q.pop(),k=a+','+b;if(seen.has(k)||grid[b]?.[a]!==v)continue;seen.add(k);out.push([a,b]);q.push([a+1,b],[a-1,b],[a,b+1],[a,b-1])}return out}function clear(g){if(g.length<2){status.textContent='Need at least two connected tiles.';return}g.forEach(([x,y])=>grid[y][x]=null);for(let x=0;x<W;x++){const vals=[];for(let y=H-1;y>=0;y--)if(grid[y][x]!=null)vals.push(grid[y][x]);for(let y=H-1,i=0;y>=0;y--)grid[y][x]=i<vals.length?vals[i++]:null}let write=0;for(let x=0;x<W;x++)if(grid.some(r=>r[x]!=null)){if(x!==write)for(let y=0;y<H;y++){grid[y][write]=grid[y][x];grid[y][x]=null}write++}combo=g.length>=5?Math.min(9,combo+1):1;const gain=g.length*g.length*10*combo;score+=gain;if(score>best){best=score;localStorage.setItem(key,best);bestEl.textContent=best}status.textContent=`Cleared ${g.length} tiles · +${gain}`;render()}function render(){el.innerHTML='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){const b=document.createElement('button');b.type='button';b.className='cell'+(grid[y][x]==null?'':' c'+grid[y][x]);b.disabled=grid[y][x]==null;b.setAttribute('role','gridcell');b.setAttribute('aria-label',grid[y][x]==null?'empty':`color ${grid[y][x]+1}`);b.onclick=()=>clear(group(x,y));el.appendChild(b)}scoreEl.textContent=score;comboEl.textContent='x'+combo;if(!grid.some(r=>r.some(v=>v!=null)))status.textContent='BOARD CLEARED · '+score+' points!'}document.getElementById('new').onclick=fresh;fresh()})();</script></body></html>
