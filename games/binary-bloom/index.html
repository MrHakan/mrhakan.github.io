<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><title>Binary Bloom 98</title><meta name="description" content="Toggle a daily binary grid until every lamp is lit in this compact retro logic puzzle."><link rel="canonical" href="https://mrhakan.github.io/games/binary-bloom/"><meta property="og:title" content="Binary Bloom 98"><meta property="og:description" content="A seeded daily lights-out style logic puzzle for mouse, keyboard and touch."><meta property="og:type" content="website"><meta property="og:url" content="https://mrhakan.github.io/games/binary-bloom/"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080}body{min-height:100vh;display:grid;place-items:center;padding:12px}.win{width:min(610px,100%);background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:7px 7px #004040;padding:3px}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:6px 8px;display:flex;justify-content:space-between}.title a{color:#000;background:#c0c0c0;text-decoration:none;padding:0 6px;border:2px solid;border-color:#fff #444 #444 #fff}.body{padding:12px}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.meter{background:#fff;border:2px inset #ddd;padding:7px;font-size:11px}.meter b{display:block;font:700 18px monospace}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px auto;max-width:390px;background:#808080;padding:9px;border:2px inset #ddd}.cell{aspect-ratio:1;border:3px solid;border-color:#fff #444 #444 #fff;background:#202020;cursor:pointer}.cell.on{background:#ffff55;box-shadow:inset 0 0 0 5px #ffd000}.btn{background:#c0c0c0;border:2px solid;border-color:#fff #444 #444 #fff;padding:7px 12px;font-weight:bold;min-height:36px}.status{margin-top:9px;background:#ffffe1;border:1px solid #808080;padding:8px;font:12px monospace;min-height:34px}.help{font-size:12px;line-height:1.45}:where(a,button):focus-visible{outline:2px solid #f0f;outline-offset:2px}@media(max-width:480px){body{padding:5px}.body{padding:8px}.board{gap:5px;padding:6px}.hud{grid-template-columns:1fr 1fr}.hud .meter:last-child{grid-column:1/-1}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main class="win"><div class="title"><span>☼ BINARY BLOOM 98.EXE</span><a href="../../" aria-label="Back to Playground">×</a></div><div class="body"><div class="hud"><div class="meter">MOVES<b id="moves">0</b></div><div class="meter">BEST<b id="best">—</b></div><div class="meter">DATE<b id="date">—</b></div></div><div id="board" class="board" role="grid" aria-label="Five by five Binary Bloom board"></div><button type="button" class="btn" id="reset">RESET DAILY GRID</button><div id="status" class="status" role="status" aria-live="polite">Light every square. A click flips itself and its four neighbors.</div><p class="help">Everyone gets the same puzzle today. Tap a square to toggle its cross-shaped neighborhood. Solve in as few moves as possible; your daily best stays on this device.</p></div></main><script>(()=>{'use strict';const N=5,b=document.getElementById('board'),movesEl=document.getElementById('moves'),bestEl=document.getElementById('best'),dateEl=document.getElementById('date'),status=document.getElementById('status');const day=new Date().toISOString().slice(0,10);dateEl.textContent=day.slice(5);const key='binary-bloom-'+day;let best=localStorage.getItem(key);bestEl.textContent=best||'—';let g=[],start=[],moves=0;function rng(s){return()=>{s=Math.imul(s^s>>>15,1|s);s^=s+Math.imul(s^s>>>7,61|s);return((s^s>>>14)>>>0)/4294967296}}function make(){let seed=[...day].reduce((a,c)=>Math.imul(a^c.charCodeAt(0),16777619),2166136261),r=rng(seed);g=Array(N*N).fill(1);for(let i=0;i<10;i++)flip(Math.floor(r()*25),false);start=g.slice();moves=0;render();status.textContent='Light every square. A click flips itself and its four neighbors.'}function flip(i,count=true){const x=i%N,y=Math.floor(i/N);[[x,y],[x+1,y],[x-1,y],[x,y+1],[x,y-1]].forEach(([a,c])=>{if(a>=0&&a<N&&c>=0&&c<N){const j=c*N+a;g[j]=g[j]?0:1}});if(count){moves++;render();if(g.every(Boolean)){if(!best||moves<+best){best=String(moves);localStorage.setItem(key,best);bestEl.textContent=best}status.textContent=`SOLVED · ${moves} moves. Nice work!`}}}function render(){b.innerHTML='';g.forEach((v,i)=>{const x=document.createElement('button');x.type='button';x.className='cell'+(v?' on':'');x.setAttribute('role','gridcell');x.setAttribute('aria-label',`row ${Math.floor(i/N)+1}, column ${i%N+1}, ${v?'on':'off'}`);x.onclick=()=>flip(i);b.appendChild(x)});movesEl.textContent=moves}document.getElementById('reset').onclick=()=>{g=start.slice();moves=0;render();status.textContent='Daily grid reset.'};make()})();</script></body></html>
