<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><title>Ghost Click 98</title><meta name="description" content="Memorize a target, then click its vanished center as accurately as you can."><link rel="canonical" href="https://mrhakan.github.io/games/ghost-click/"><meta property="og:title" content="Ghost Click 98"><meta property="og:description" content="A five-round spatial memory and precision challenge."><meta property="og:type" content="website"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080}body{min-height:100vh;display:grid;place-items:center;padding:12px}.win{width:min(720px,100%);background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:7px 7px #004040;padding:3px}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:6px 8px;display:flex;justify-content:space-between}.title a{color:#000;background:#c0c0c0;text-decoration:none;padding:0 6px;border:2px solid;border-color:#fff #444 #444 #fff}.body{padding:10px}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.meter{background:#fff;border:2px inset #ddd;padding:6px;font-size:11px}.meter b{display:block;font:700 18px monospace}.field{height:min(58vh,420px);min-height:280px;margin:10px 0;background:#101820;border:3px inset #ddd;position:relative;cursor:crosshair;overflow:hidden;touch-action:manipulation}.target{position:absolute;width:46px;height:46px;border-radius:50%;border:4px solid #fff;background:#f33;box-shadow:0 0 0 6px #ff0;transform:translate(-50%,-50%)}.mark{position:absolute;width:18px;height:18px;border:2px solid #0ff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.btn{background:#c0c0c0;border:2px solid;border-color:#fff #444 #444 #fff;padding:7px 12px;font-weight:bold}.status{background:#ffffe1;border:1px solid #808080;padding:8px;font:12px monospace;min-height:34px}.help{font-size:12px;line-height:1.4}/* Playground focus visibility */:where(a,button,.field):focus-visible{outline:2px solid #f0f;outline-offset:2px}@media(max-width:480px){body{padding:5px}.hud{grid-template-columns:1fr 1fr}.hud .meter:last-child{grid-column:1/-1}.field{min-height:320px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main class="win"><div class="title"><span>◎ GHOST CLICK 98.EXE</span><a href="../../" aria-label="Back to Playground">×</a></div><div class="body"><div class="hud"><div class="meter">ROUND<b id="round">0 / 5</b></div><div class="meter">SCORE<b id="score">0</b></div><div class="meter">BEST<b id="best">—</b></div></div><div id="field" class="field" role="button" tabindex="0" aria-label="Memory field. Click the remembered target center when it disappears."></div><button type="button" class="btn" id="start">START 5 ROUNDS</button><div id="status" class="status" aria-live="polite">Press Start. The target appears briefly, then vanishes.</div><p class="help">Remember the center, not the edge. After 900 ms the target disappears; click where its center was. Each round scores up to 1000 points based on pixel distance.</p></div></main><script>(()=>{'use strict';const f=document.getElementById('field'),st=document.getElementById('status'),re=document.getElementById('round'),se=document.getElementById('score'),be=document.getElementById('best');let round=0,score=0,pos=null,ready=false,timer=null;const key='ghost-click-best';let best=+localStorage.getItem(key)||0;be.textContent=best||'—';function show(){f.innerHTML='';const r=f.getBoundingClientRect();pos={x:60+Math.random()*(r.width-120),y:60+Math.random()*(r.height-120)};const t=document.createElement('div');t.className='target';t.style.left=pos.x+'px';t.style.top=pos.y+'px';f.appendChild(t);ready=false;st.textContent='Memorize the target center…';timer=setTimeout(()=>{t.remove();ready=true;st.textContent='CLICK THE VANISHED CENTER!'},900)}function hit(e){if(!ready||!pos)return;const r=f.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,d=Math.hypot(x-pos.x,y-pos.y),pts=Math.max(0,Math.round(1000-d*8));score+=pts;ready=false;const m=document.createElement('div');m.className='mark';m.style.left=x+'px';m.style.top=y+'px';f.appendChild(m);st.textContent=`Miss distance: ${Math.round(d)} px · +${pts} points`;se.textContent=score;if(round<5){setTimeout(()=>{round++;re.textContent=round+' / 5';show()},800)}else{if(score>best){best=score;localStorage.setItem(key,best);be.textContent=best}st.textContent+=` · FINAL ${score}`}}f.addEventListener('pointerdown',hit);document.getElementById('start').onclick=()=>{clearTimeout(timer);round=1;score=0;se.textContent=0;re.textContent='1 / 5';show()}})();</script></body></html>
