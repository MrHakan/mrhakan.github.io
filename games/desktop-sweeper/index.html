<title>Desktop Sweeper 98</title><style>*{box-sizing:border-box}body{margin:0;padding:8px;background:#008080;font:13px 'MS Sans Serif',Tahoma,sans-serif}.win{max-width:760px;margin:auto;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff}.title{background:#000080;color:#fff;font-weight:bold;padding:5px;display:flex}.title a{margin-left:auto;color:#000;background:#c0c0c0;text-decoration:none;padding:0 5px}.bar{display:flex;gap:7px;flex-wrap:wrap;padding:8px}.box,button{border:2px solid;border-color:#fff #000 #000 #fff;background:#c0c0c0;padding:7px;font-weight:bold}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px;background:#808080;margin:0 8px 8px}.cell{aspect-ratio:1;min-width:0;font:bold clamp(12px,4vw,24px) monospace;padding:0;touch-action:manipulation}.cell.open{border:1px solid #888;background:#ddd}.cell.mine{background:#f88}.status{margin:8px;border:2px inset #fff;background:#fff;padding:8px;font-family:monospace}.help{padding:0 9px 10px;font-size:11px}@media(max-width:520px){body{padding:3px}.board{gap:1px;padding:4px;margin:4px}.cell{font-size:15px}}

</style></head><body><main class="win"><div class="title">💣 DESKTOP SWEEPER 98.EXE<a href="../../">×</a></div><div class="bar"><span class="box">MINES <b id="left">10</b></span><span class="box">TIME <b id="time">000</b></span><span class="box">BEST <b id="best">---</b></span><button id="new">🙂 NEW GAME</button></div><div id="board" class="board"></div><div id="status" class="status">Clear the desktop without opening a corrupted file.</div><div class="help">Tap/click to open. Right-click, long-press, or press F while hovering to flag. First click is always safe. Fully client-side; best time stays on this device.</div></main><script>(()=>{'use strict';const N=8,M=10,b=document.getElementById('board'),L=document.getElementById('left'),T=document.getElementById('time'),S=document.getElementById('status'),B=document.getElementById('best');let cells,mines,open,flags,start,timer,over,hover=-1;try{B.textContent=localStorage.getItem('desktop-sweeper-best')||'---'}catch(e){}function reset(){clearInterval(timer);cells=Array(N*N).fill(0);mines=new Set;open=new Set;flags=new Set;start=0;over=false;T.textContent='000';S.textContent='Clear the desktop without opening a corrupted file.';b.innerHTML='';for(let i=0;i<N*N;i++){let x=document.createElement('button');x.className='cell';x.textContent='📄';x.onmouseenter=()=>hover=i;x.onclick=()=>reveal(i);x.oncontextmenu=e=>{e.preventDefault();flag(i)};let hold;x.onpointerdown=e=>{if(e.pointerType!=='mouse')hold=setTimeout(()=>flag(i),550)};x.onpointerup=x.onpointercancel=()=>clearTimeout(hold);b.appendChild(x)}hud()}function seed(safe){while(mines.size<M){let x=Math.floor(Math.random()*N*N);if(x!==safe&&!near(x,safe))mines.add(x)}for(let i=0;i<N*N;i++)if(!mines.has(i))cells[i]=neighbors(i).filter(x=>mines.has(x)).length}function near(a,c){return Math.abs(a%N-c%N)<=1&&Math.abs(Math.floor(a/N)-Math.floor(c/N))<=1}function neighbors(i){let r=[],x=i%N,y=Math.floor(i/N);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let X=x+dx,Y=y+dy;if((dx||dy)&&X>=0&&X<N&&Y>=0&&Y<N)r.push(Y*N+X)}return r}function reveal(i){if(over||flags.has(i)||open.has(i))return;if(!start){seed(i);start=Date.now();timer=setInterval(tick,250)}if(mines.has(i)){over=true;clearInterval(timer);mines.forEach(x=>{let e=b.children[x];e.textContent='💣';e.classList.add('mine')});S.textContent='SYSTEM FAILURE — corrupted file opened. Try again.';return}let q=[i];while(q.length){let x=q.pop();if(open.has(x)||flags.has(x))continue;open.add(x);let e=b.children[x];e.classList.add('open');e.textContent=cells[x]||'';if(!cells[x])neighbors(x).forEach(n=>{if(!mines.has(n)&&!open.has(n))q.push(n)})}if(open.size===N*N-M)win()}function flag(i){if(over||open.has(i))return;flags.has(i)?flags.delete(i):flags.size<M&&flags.add(i);b.children[i].textContent=flags.has(i)?'🚩':'📄';hud()}function hud(){L.textContent=M-flags.size}function tick(){T.textContent=String(Math.min(999,Math.floor((Date.now()-start)/1000))).padStart(3,'0')}function win(){over=true;clearInterval(timer);tick();let s=Math.floor((Date.now()-start)/1000),best=Infinity;try{best=+(localStorage.getItem('desktop-sweeper-best')||Infinity);if(s<best){localStorage.setItem('desktop-sweeper-best',s);B.textContent=s+'s'}}catch(e){}S.textContent='Desktop clean! '+s+' seconds'+(s<best?' — NEW BEST!':'')+'.'}document.getElementById('new').onclick=reset;document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'&&hover>=0){e.preventDefault();flag(hover)}});reset()})();</script></body></html>
