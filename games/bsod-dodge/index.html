<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#008080"><title>BSOD Dodge 98</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#008080;font-family:"MS Sans Serif",Tahoma,Arial,sans-serif}.win{max-width:920px;margin:10px auto;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:5px 5px #004040}.title{background:#000080;color:#fff;font-weight:bold;padding:4px 6px;display:flex}.title a{margin-left:auto;color:#000;background:#c0c0c0;text-decoration:none;padding:0 6px;border:2px solid;border-color:#fff #000 #000 #fff}.bar{padding:7px;display:flex;gap:6px;flex-wrap:wrap}.box,button{border:2px solid;border-color:#fff #000 #000 #fff;background:#c0c0c0;padding:6px;font-weight:bold}.stage{margin:0 8px 8px;border:2px solid;border-color:#808080 #fff #fff #808080;background:#008080;position:relative}.stage canvas{display:block;width:100%;height:auto;aspect-ratio:16/10;touch-action:none}.msg{padding:7px;margin:0 8px 8px;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;font:12px monospace}.help{padding:0 10px 10px;font-size:11px}@media(max-width:600px){.win{margin:4px}.bar{gap:3px}.box,button{padding:5px;font-size:11px}}</style></head><body><main class="win"><div class="title">💥 BSOD DODGE 98.EXE<a href="../../">×</a></div><div class="bar"><span class="box">SCORE <b id="score">0</b></span><span class="box">BEST <b id="best">0</b></span><span class="box">LIVES <b id="lives">3</b></span><span class="box">LEVEL <b id="level">1</b></span><button id="start">START / RESTART</button></div><div class="stage"><canvas id="c" width="800" height="500"></canvas></div><div class="msg" id="msg">Keep the cursor away from crashing blue screens. Collect green SAFE MODE icons.</div><div class="help">Move with mouse or finger. Blue crash windows chase your cursor; green SAFE MODE pickups clear one crash and award bonus points. Survive as long as possible.</div></main><script>(()=>{'use strict';const c=document.getElementById('c'),x=c.getContext('2d'),$=i=>document.getElementById(i),S=$('score'),B=$('best'),L=$('lives'),V=$('level'),M=$('msg');let best=+(localStorage.getItem('bsod-dodge-best')||0),score=0,lives=3,level=1,run=false,last=0,spawn=0,pick=0,inv=0,p={x:400,y:250},bad=[],good=[];B.textContent=best;function pt(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*800/r.width,y:(e.clientY-r.top)*500/r.height}}c.onpointermove=e=>{p=pt(e);e.preventDefault()};c.onpointerdown=e=>{p=pt(e);e.preventDefault()};function reset(){score=0;lives=3;level=1;bad=[];good=[];spawn=pick=0;inv=0;run=true;last=performance.now();M.textContent='System unstable. Dodge!';requestAnimationFrame(loop)}$('start').onclick=reset;function crash(){if(inv>0)return;lives--;inv=1.1;L.textContent=lives;if(lives<=0){run=false;if(score>best){best=score;localStorage.setItem('bsod-dodge-best',best);B.textContent=best}M.textContent='FATAL EXCEPTION. Score '+score+'. Press START to reboot.'}}function loop(t){if(!run)return;let dt=Math.min(.035,(t-last)/1000);last=t;score+=Math.floor(dt*100);level=1+Math.floor(score/700);spawn-=dt;pick-=dt;inv=Math.max(0,inv-dt);if(spawn<=0){let side=Math.floor(Math.random()*4),o={x:0,y:0,w:90+Math.random()*55,h:55+Math.random()*35,v:45+level*8};if(side===0){o.x=Math.random()*700;o.y=-o.h}else if(side===1){o.x=800;o.y=Math.random()*430}else if(side===2){o.x=Math.random()*700;o.y=500}else{o.x=-o.w;o.y=Math.random()*430}bad.push(o);spawn=Math.max(.28,1.15-level*.055)}if(pick<=0){good.push({x:40+Math.random()*720,y:60+Math.random()*390,r:15,life:5});pick=5+Math.random()*4}for(let o of bad){let dx=p.x-(o.x+o.w/2),dy=p.y-(o.y+o.h/2),d=Math.hypot(dx,dy)||1;o.x+=dx/d*o.v*dt;o.y+=dy/d*o.v*dt;if(p.x>o.x&&p.x<o.x+o.w&&p.y>o.y&&p.y<o.y+o.h){crash();o.x=-999}}for(let g of good){g.life-=dt;if(Math.hypot(p.x-g.x,p.y-g.y)<24){score+=300;if(bad.length)bad.shift();g.life=0;M.textContent='SAFE MODE! +300 and one crash cleared.'}}bad=bad.filter(o=>o.x>-500);good=good.filter(g=>g.life>0);draw();S.textContent=score;L.textContent=lives;V.textContent=level;requestAnimationFrame(loop)}function draw(){x.fillStyle='#008080';x.fillRect(0,0,800,500);x.fillStyle='#c0c0c0';x.fillRect(0,470,800,30);x.fillStyle='#000';x.fillRect(5,475,65,20);x.fillStyle='#fff';x.font='bold 12px Arial';x.fillText('Start',18,490);for(let o of bad){x.fillStyle='#c0c0c0';x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#000080';x.fillRect(o.x+3,o.y+3,o.w-6,o.h-6);x.fillStyle='#fff';x.font='11px monospace';x.fillText('FATAL ERROR',o.x+10,o.y+22);x.fillText('0E : 0028',o.x+10,o.y+39)}for(let g of good){x.fillStyle='#00a000';x.fillRect(g.x-14,g.y-14,28,28);x.fillStyle='#fff';x.font='bold 16px monospace';x.fillText('S',g.x-5,g.y+6)}x.strokeStyle=inv>0?'#ffff00':'#fff';x.lineWidth=2;x.beginPath();x.moveTo(p.x-10,p.y);x.lineTo(p.x+10,p.y);x.moveTo(p.x,p.y-10);x.lineTo(p.x,p.y+10);x.stroke()}draw()})();</script></body></html>
