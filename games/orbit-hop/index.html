<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#008080">
<meta name="description" content="A seeded daily orbit runner where you jump craters and collect starbits.">
<link rel="canonical" href="https://mrhakan.github.io/games/orbit-hop/">
<meta property="og:type" content="website">
<meta property="og:title" content="Orbit Hop 98">
<meta property="og:description" content="A seeded daily orbit runner where you jump craters and collect starbits.">
<meta property="og:url" content="https://mrhakan.github.io/games/orbit-hop/">
<title>Orbit Hop 98</title>
<style>
:root{font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;color:#000;background:#008080}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#008080}body{display:grid;place-items:center;padding:18px}.window{width:min(820px,100%);background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:2px 2px 0 #000}.titlebar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(90deg,#000080,#1084d0);color:#fff;padding:3px 4px;font-weight:700;font-size:14px}.titlebar a{color:#000;text-decoration:none;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;padding:0 5px;line-height:17px}.panel{padding:10px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}.meter{background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:5px 7px;font-size:12px}.meter b{display:block;font-size:16px;margin-top:2px}canvas{display:block;width:100%;height:auto;background:#020314;border:2px solid;border-color:#808080 #fff #fff #808080;image-rendering:pixelated;touch-action:manipulation}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:9px}.btn{appearance:none;background:#c0c0c0;color:#000;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:1px 1px 0 #000;padding:7px 14px;font:700 13px inherit;cursor:pointer}.btn:active{border-color:#000 #fff #fff #000;transform:translate(1px,1px);box-shadow:none}.status{flex:1;min-width:220px;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:7px;font-size:12px}.help{margin:9px 0 0;font-size:12px;line-height:1.45}.kbd{font-family:monospace;background:#fff;border:1px solid #808080;padding:1px 4px}@media(max-width:560px){body{padding:7px}.panel{padding:7px}.hud{grid-template-columns:1fr 1fr}.meter b{font-size:14px}.btn{flex:1}.status{order:3;min-width:100%}}

:focus-visible{outline:2px solid #000080;outline-offset:2px}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0ms!important}
}
</style>
</head>
<body>
<main class="window" aria-label="Orbit Hop 98 daily minigame">
  <div class="titlebar"><span>🌍 ORBIT HOP 98 — DAILY CHALLENGE</span><a href="../../">×</a></div>
  <div class="panel">
    <div class="hud">
      <div class="meter">DAILY SEED<b id="seed">----</b></div>
      <div class="meter">STARBITS<b><span id="stars">0</span>/<span id="starTotal">0</span></b></div>
      <div class="meter">HITS<b id="hits">0</b></div>
      <div class="meter">BEST<b id="best">----</b></div>
    </div>
    <canvas id="game" width="760" height="430" aria-label="Orbit Hop game canvas"></canvas>
    <div class="controls">
      <button class="btn" id="jump">JUMP!</button>
      <button class="btn" id="restart">NEW RUN</button>
      <button class="btn" id="share">SHARE</button>
      <div class="status" id="status">Press SPACE, ↑, tap the planet, or hit JUMP to begin.</div>
    </div>
    <p class="help">One tiny planet, one route per UTC day. Jump over red craters and collect gold starbits. Everyone gets the same obstacle layout. Controls: <span class="kbd">SPACE</span> / <span class="kbd">↑</span> / tap.</p>
  </div>
</main>
<script>
(() => {
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const seedEl=document.getElementById('seed'),starsEl=document.getElementById('stars'),starTotalEl=document.getElementById('starTotal'),hitsEl=document.getElementById('hits'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status');
const TAU=Math.PI*2,CX=380,CY=232,R=116;
const dateKey=new Date().toISOString().slice(0,10); seedEl.textContent=dateKey;
function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand=rng32(hash('mrhakan-orbit-hop:'+dateKey));
const hazards=[],starbits=[];
let cursor=.55;
for(let i=0;i<8;i++){cursor+=.45+rand()*.24;hazards.push({a:cursor,hit:false});if(cursor>5.55)break}
for(let i=0;i<11;i++){let a=.42+rand()*5.45;while(hazards.some(h=>Math.abs(h.a-a)<.14))a=.42+rand()*5.45;starbits.push({a,got:false})}
starbits.sort((a,b)=>a.a-b.a); starTotalEl.textContent=starbits.length;
let running=false,finished=false,progress=0,jumpH=0,jumpV=0,last=0,hits=0,stars=0,startAt=0;
const bestKey='orbit-hop-best:'+dateKey;const stored=localStorage.getItem(bestKey);bestEl.textContent=stored||'----';
function reset(){running=false;finished=false;progress=0;jumpH=0;jumpV=0;last=0;hits=0;stars=0;startAt=0;hazards.forEach(x=>x.hit=false);starbits.forEach(x=>x.got=false);starsEl.textContent='0';hitsEl.textContent='0';statusEl.textContent='Press SPACE, ↑, tap the planet, or hit JUMP to begin.';draw(0)}
function doJump(){if(finished){reset();return}if(!running){running=true;startAt=performance.now();statusEl.textContent='Run started — keep moving!'}if(jumpH<3){jumpV=205}}
function score(){const elapsed=(performance.now()-startAt)/1000;return Math.max(0,Math.round(1000+stars*125-hits*280-Math.max(0,elapsed-12)*8))}
function finish(){running=false;finished=true;const s=score();const prev=+(localStorage.getItem(bestKey)||0);if(s>prev){localStorage.setItem(bestKey,String(s));bestEl.textContent=s}statusEl.textContent=`FINISH! score ${s} — ${stars}/${starbits.length} starbits, ${hits} hit${hits===1?'':'s'}. Tap NEW RUN to retry.`;draw(0)}
function near(a,b,d){return Math.abs(a-b)<d}
function update(dt){if(!running||finished)return;progress+=dt*.54;jumpH+=jumpV*dt;jumpV-=460*dt;if(jumpH<=0){jumpH=0;jumpV=0}
  for(const h of hazards){if(!h.hit&&near(progress,h.a,.055)){h.hit=true;if(jumpH<26){hits++;hitsEl.textContent=hits;statusEl.textContent='BONK! Jump a little earlier.'}}}
  for(const s of starbits){if(!s.got&&near(progress,s.a,.065)){s.got=true;stars++;starsEl.textContent=stars;statusEl.textContent='Starbit collected!'}}
  if(progress>=TAU-.22)finish();
}
function polar(a,r){const ang=a-Math.PI/2;return{x:CX+Math.cos(ang)*r,y:CY+Math.sin(ang)*r}}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);
  const g=ctx.createLinearGradient(0,0,0,canvas.height);g.addColorStop(0,'#050724');g.addColorStop(1,'#11031c');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#fff';for(let i=0;i<80;i++){const n=hash(dateKey+':'+i);const x=n%760,y=(n>>>9)%430,s=(n>>>20)%3+1;ctx.globalAlpha=.25+((n>>>24)%70)/100;ctx.fillRect(x,y,s,s)}ctx.globalAlpha=1;
  const pg=ctx.createRadialGradient(CX-42,CY-48,20,CX,CY,R+8);pg.addColorStop(0,'#66d9ff');pg.addColorStop(.55,'#137a58');pg.addColorStop(1,'#092934');ctx.fillStyle=pg;ctx.beginPath();ctx.arc(CX,CY,R,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(CX,CY,R+22,0,TAU);ctx.stroke();
  for(const h of hazards){const p=polar(h.a,R+5);ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle=h.hit?'#6b1d1d':'#ff3b30';ctx.beginPath();ctx.ellipse(0,0,12,6,0,0,TAU);ctx.fill();ctx.fillStyle='#6c0000';ctx.beginPath();ctx.ellipse(1,1,6,3,0,0,TAU);ctx.fill();ctx.restore()}
  for(const s of starbits){if(s.got)continue;const p=polar(s.a,R+26);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(s.a);ctx.fillStyle='#ffd600';ctx.font='bold 20px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,0);ctx.restore()}
  const pp=polar(progress,R+24+jumpH);const angle=progress;ctx.save();ctx.translate(pp.x,pp.y);ctx.rotate(angle);ctx.fillStyle='#e7e7e7';ctx.fillRect(-8,-12,16,19);ctx.fillStyle='#1d56d8';ctx.fillRect(-7,-10,14,8);ctx.fillStyle='#fff';ctx.fillRect(-5,-8,3,3);ctx.fillRect(2,-8,3,3);ctx.fillStyle='#ffcc00';ctx.fillRect(-7,7,5,6);ctx.fillRect(2,7,5,6);ctx.restore();
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(18,18,215,42);ctx.fillStyle='#fff';ctx.font='bold 15px monospace';ctx.fillText(finished?'RUN COMPLETE':running?'ORBIT IN PROGRESS':'READY',30,38);ctx.font='12px monospace';ctx.fillStyle='#9ee7ff';ctx.fillText(`progress ${Math.min(100,Math.round(progress/(TAU-.22)*100))}%`,30,54);
}
function frame(t){const dt=last?Math.min(.033,(t-last)/1000):0;last=t;update(dt);draw();requestAnimationFrame(frame)}
document.getElementById('jump').addEventListener('click',doJump);document.getElementById('restart').addEventListener('click',reset);canvas.addEventListener('pointerdown',e=>{e.preventDefault();doJump()});
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();doJump()}});
document.getElementById('share').addEventListener('click',async()=>{const s=finished?score():0;const text=finished?`Orbit Hop 98 ${dateKey}: ${s} points, ${stars}/${starbits.length} starbits, ${hits} hits. ${location.href}`:`Orbit Hop 98 daily challenge — ${dateKey}. ${location.href}`;try{await navigator.clipboard.writeText(text);statusEl.textContent='Result copied to clipboard.'}catch{statusEl.textContent=text}});
reset();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
