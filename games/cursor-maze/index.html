<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#008080"><meta name="description" content="Guide the cursor through procedural mazes without touching the walls.">

<title>Cursor Maze 98</title><style>:root{font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080}*{box-sizing:border-box}body{margin:0;padding:10px;background:#008080}.win{max-width:900px;margin:auto;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:5px 5px #004646}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:5px;display:flex}.title a{margin-left:auto;background:#c0c0c0;color:#000;text-decoration:none;padding:0 6px;border:2px solid;border-color:#fff #000 #000 #fff}.bar{display:flex;gap:6px;flex-wrap:wrap;padding:8px}.box,button{background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;padding:6px;font:bold 12px monospace}button{cursor:pointer}.stage{margin:0 8px 8px;border:2px solid;border-color:#808080 #fff #fff #808080;background:#fff;position:relative}.stage canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;touch-action:none}.msg{padding:7px 9px;margin:0 8px 8px;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;font:12px monospace}.help{padding:0 10px 10px;font-size:11px;color:#333}@media(max-width:600px){body{padding:4px}.bar{padding:5px}.stage,.msg{margin-left:5px;margin-right:5px}}
:focus-visible{outline:2px solid #000080;outline-offset:2px}

</style></head><body><main class="win"><div class="title">🖱️ CURSOR MAZE 98.EXE<a href="../../">×</a></div><div class="bar"><div class="box">LEVEL <span id="level">1</span></div><div class="box">TIME <span id="time">0.0</span>s</div><div class="box">BEST <span id="best">--</span></div><button id="new">NEW MAZE</button></div><div class="stage"><canvas id="c" width="800" height="600"></canvas></div><div class="msg" id="msg">Move from START to EXIT without touching a wall.</div><div class="help">Mouse/touch: move the cursor. Keyboard: arrow keys / WASD. Touch the green START first, then reach the red EXIT. Hitting a wall resets the run. Mazes get larger each level.</div></main><script>(()=>{'use strict';const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id);let level=1,cols=8,rows=6,grid=[],px=0,py=0,active=false,start=0,best=0,last=0;try{best=+(localStorage.getItem('cursor-maze-best')||0)}catch(e){}$('best').textContent=best?best.toFixed(1)+'s':'--';function maze(){cols=Math.min(18,7+level);rows=Math.min(14,5+Math.ceil(level*.7));grid=Array.from({length:rows},()=>Array.from({length:cols},()=>[1,1,1,1,0]));const stack=[[0,0]];grid[0][0][4]=1;while(stack.length){const [cx,cy]=stack[stack.length-1],n=[];if(cy>0&&!grid[cy-1][cx][4])n.push([cx,cy-1,0,2]);if(cx<cols-1&&!grid[cy][cx+1][4])n.push([cx+1,cy,1,3]);if(cy<rows-1&&!grid[cy+1][cx][4])n.push([cx,cy+1,2,0]);if(cx>0&&!grid[cy][cx-1][4])n.push([cx-1,cy,3,1]);if(!n.length){stack.pop();continue}const [nx,ny,a,b]=n[Math.floor(Math.random()*n.length)];grid[cy][cx][a]=0;grid[ny][nx][b]=0;grid[ny][nx][4]=1;stack.push([nx,ny])}px=(.5)*c.width/cols;py=(.5)*c.height/rows;active=false;start=0;$('level').textContent=level;$('time').textContent='0.0';$('msg').textContent='Touch START to begin.';draw()}function draw(){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);const w=c.width/cols,h=c.height/rows;x.lineWidth=Math.max(5,13-level*.35);x.strokeStyle='#000080';x.lineCap='square';for(let y=0;y<rows;y++)for(let q=0;q<cols;q++){const g=grid[y][q],l=q*w,t=y*h;if(g[0])line(l,t,l+w,t);if(g[1])line(l+w,t,l+w,t+h);if(g[2])line(l,t+h,l+w,t+h);if(g[3])line(l,t,l,t+h)}x.fillStyle='#00a000';x.fillRect(x.lineWidth, x.lineWidth,w-x.lineWidth*2,h-x.lineWidth*2);x.fillStyle='#d00000';x.fillRect((cols-1)*w+x.lineWidth,(rows-1)*h+x.lineWidth,w-x.lineWidth*2,h-x.lineWidth*2);x.fillStyle='#fff';x.font='bold 13px monospace';x.textAlign='center';x.fillText('START',w/2,h/2+4);x.fillText('EXIT',(cols-.5)*w,(rows-.5)*h+4);x.fillStyle='#000';x.beginPath();x.arc(px,py,6,0,7);x.fill()}function line(a,b,d,e){x.beginPath();x.moveTo(a,b);x.lineTo(d,e);x.stroke()}function wallHit(nx,ny){const w=c.width/cols,h=c.height/rows,cx=Math.max(0,Math.min(cols-1,Math.floor(nx/w))),cy=Math.max(0,Math.min(rows-1,Math.floor(ny/h))),g=grid[cy][cx],lx=nx-cx*w,ly=ny-cy*h,m=x.lineWidth*.62;return lx<m&&g[3]||lx>w-m&&g[1]||ly<m&&g[0]||ly>h-m&&g[2]}function move(nx,ny){nx=Math.max(1,Math.min(c.width-1,nx));ny=Math.max(1,Math.min(c.height-1,ny));const w=c.width/cols,h=c.height/rows;if(!active&&nx<w&&ny<h){active=true;start=performance.now();$('msg').textContent='Go! Avoid the blue walls.'}if(active&&wallHit(nx,ny)){active=false;px=w/2;py=h/2;$('msg').textContent='BONK! Wall hit — back to START.';tone(110);draw();return}px=nx;py=ny;if(active&&nx>(cols-1)*w&&ny>(rows-1)*h){const t=(performance.now()-start)/1000;active=false;if(!best||t<best){best=t;try{localStorage.setItem('cursor-maze-best',best)}catch(e){}$('best').textContent=best.toFixed(1)+'s'}$('msg').textContent='Level '+level+' cleared in '+t.toFixed(1)+'s!';tone(700);level++;setTimeout(maze,650)}draw()}function tone(f){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.12);o.stop(a.currentTime+.13)}catch(e){}}c.onpointermove=e=>{const r=c.getBoundingClientRect();move((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height)};c.onpointerdown=c.onpointermove;addEventListener('keydown',e=>{const k=e.key.toLowerCase(),d=12;if(['arrowleft','a'].includes(k))move(px-d,py);else if(['arrowright','d'].includes(k))move(px+d,py);else if(['arrowup','w'].includes(k))move(px,py-d);else if(['arrowdown','s'].includes(k))move(px,py+d);else return;e.preventDefault()});$('new').onclick=()=>{level=1;maze()};function tick(t){if(active&&t-last>80){$('time').textContent=((t-start)/1000).toFixed(1);last=t}requestAnimationFrame(tick)}maze();requestAnimationFrame(tick)})();</script></body></html>
