<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Lock 98</title><meta name="description" content="Crack a seeded daily four-symbol lock with exact and misplaced clues."><link rel="canonical" href="https://mrhakan.github.io/games/pixel-lock/"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:12px;background:#008080;font:14px Tahoma,Arial,sans-serif}.win{width:min(620px,100%);background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:7px 7px #004848;padding:3px}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:7px;display:flex;justify-content:space-between}.title a{color:#000;background:#c0c0c0;text-decoration:none;padding:0 6px;border:2px outset #eee}.body{padding:12px}.hud{display:flex;gap:8px;flex-wrap:wrap}.box,.status{background:#ffffe1;border:1px solid #808080;padding:7px}.board{display:grid;gap:6px;margin:12px 0}.row{display:flex;gap:6px;align-items:center}.cell,.pick,.btn{border:2px solid;border-color:#fff #404040 #404040 #fff;background:#d4d0c8;min-width:42px;min-height:42px;font-size:21px}.cell{display:grid;place-items:center;background:#fff;border-style:inset}.clue{font:12px "Courier New",monospace;margin-left:5px}.picks{display:flex;gap:6px;flex-wrap:wrap}.btn{font-size:12px;font-weight:bold;padding:7px}.status{margin-top:10px;min-height:34px}:focus-visible{outline:2px solid #f0f;outline-offset:2px}@media(max-width:480px){.cell,.pick{min-width:36px;min-height:38px}.body{padding:8px}}</style></head><body><main class="win"><div class="title"><span>🔐 PIXEL LOCK 98.EXE</span><a href="../../" aria-label="Back to Playground">×</a></div><div class="body"><div class="hud"><span class="box">DAILY <b id="date"></b></span><span class="box">TRY <b id="try">1/8</b></span><span class="box">BEST <b id="best">—</b></span></div><div id="board" class="board" aria-label="Guess history"></div><div class="picks" id="picks" aria-label="Symbol choices"></div><p><button class="btn" id="del">DELETE</button> <button class="btn" id="enter">ENTER GUESS</button> <button class="btn" id="share">SHARE</button></p><div class="status" id="status" role="status" aria-live="polite">Pick four symbols. ◎ = exact spot, ○ = right symbol/wrong spot.</div></div></main><script>(()=>{'use strict';const S=['💾','📁','🖱️','💿','⌨️','🖥️'],D=new Date().toISOString().slice(0,10);document.querySelector('#date').textContent=D;let h=2166136261;for(const c of 'pixel-lock:'+D){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}let secret=[];for(let i=0;i<4;i++){h=(h*1664525+1013904223)>>>0;secret.push(S[h%S.length])}let cur=[],rows=[],done=false;const $=s=>document.querySelector(s),board=$('#board'),status=$('#status');function score(g){let exact=0,a={},b={};g.forEach((x,i)=>{if(x===secret[i])exact++;else{a[x]=(a[x]||0)+1;b[secret[i]]=(b[secret[i]]||0)+1}});let near=0;for(const k in a)near+=Math.min(a[k],b[k]||0);return[exact,near]}function render(){board.innerHTML='';rows.forEach(r=>{const d=document.createElement('div');d.className='row';d.innerHTML=r.g.map(x=>'<span class="cell">'+x+'</span>').join('')+'<span class="clue">'+'◎'.repeat(r.s[0])+'○'.repeat(r.s[1])+'</span>';board.appendChild(d)});if(!done){const d=document.createElement('div');d.className='row';d.innerHTML=[0,1,2,3].map(i=>'<span class="cell">'+(cur[i]||'·')+'</span>').join('');board.appendChild(d)}$('#try').textContent=Math.min(rows.length+1,8)+'/8'}S.forEach(x=>{const b=document.createElement('button');b.className='pick';b.textContent=x;b.setAttribute('aria-label','Choose '+x);b.onclick=()=>{if(!done&&cur.length<4){cur.push(x);render()}};$('#picks').appendChild(b)});$('#del').onclick=()=>{cur.pop();render()};$('#enter').onclick=()=>{if(done)return;if(cur.length!==4){status.textContent='Choose four symbols first.';return}const s=score(cur);rows.push({g:cur.slice(),s});cur=[];if(s[0]===4){done=true;status.textContent='LOCK OPENED in '+rows.length+' guesses!';localStorage.setItem('pixel-lock-best:'+D,String(rows.length));$('#best').textContent=rows.length}else if(rows.length>=8){done=true;status.textContent='LOCKED OUT. Code was '+secret.join(' ')}else status.textContent=s[0]+' exact, '+s[1]+' misplaced.';render()};$('#share').onclick=async()=>{const t='Pixel Lock 98 '+D+' '+(done?rows.length+'/8':'in progress')+'\n'+rows.map(r=>'🟩'.repeat(r.s[0])+'🟨'.repeat(r.s[1])+'⬜'.repeat(4-r.s[0]-r.s[1])).join('\n')+'\nhttps://mrhakan.github.io/games/pixel-lock/';try{await navigator.clipboard.writeText(t);status.textContent='Result copied.'}catch{status.textContent='Clipboard unavailable.'}};$('#best').textContent=localStorage.getItem('pixel-lock-best:'+D)||'—';render()})();</script></body></html>
