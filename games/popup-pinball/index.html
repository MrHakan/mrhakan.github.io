<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#008080"><title>Popup Pinball 98</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#008080;font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;color:#000}body{padding:10px;display:grid;place-items:start center}.win{width:min(880px,100%);background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:5px 5px #004d4d}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:700;padding:4px 6px;display:flex}.title a{margin-left:auto;background:#c0c0c0;color:#000;text-decoration:none;border:2px solid;border-color:#fff #000 #000 #fff;padding:0 6px}.bar{display:flex;gap:6px;flex-wrap:wrap;padding:7px}.box,.btn{border:2px solid;border-color:#fff #000 #000 #fff;background:#c0c0c0;padding:6px 9px;font-size:12px}.btn{font-weight:bold;cursor:pointer}.btn:active{border-color:#000 #fff #fff #000}.stage{margin:0 8px 8px;border:2px solid;border-color:#808080 #fff #fff #808080;background:#001d38;position:relative;overflow:hidden}.stage canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;touch-action:none}.msg{margin:0 8px 8px;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:7px;font:12px/1.4 monospace}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#000a;padding:16px}.overlay[hidden]{display:none}.card{max-width:430px;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;padding:14px;font-size:13px;line-height:1.45}.card h2{margin:0 0 8px;color:#000080}@media(max-width:600px){body{padding:4px}.bar{padding:5px}.box,.btn{padding:6px;font-size:11px}}</style></head><body><main class="win"><div class="title">🪟 POPUP PINBALL 98.EXE <a href="../../" aria-label="Back">×</a></div><div class="bar"><div class="box">SCORE <b id="score">0</b></div><div class="box">BALLS <b id="balls">3</b></div><div class="box">LEVEL <b id="level">1</b></div><div class="box">BEST <b id="best">0</b></div><button class="btn" id="new">NEW GAME</button></div><div class="stage"><canvas id="c" width="800" height="600" aria-label="Popup Pinball game"></canvas><div class="overlay" id="ov"><div class="card" id="card"><h2>Popup Pinball 98</h2>The desktop is drowning in popups. Keep the cursor-ball alive with the left and right taskbar flippers, smash popup windows, and chain combos.<br><br><b>Controls:</b> ←/A and →/D, or tap the left/right half of the board.<br><button class="btn" id="start">START</button></div></div></div><div class="msg" id="msg">Ready.</div></main><script>(()=>{'use strict';const c=document.getElementById('c'),g=c.getContext('2d'),$=x=>document.getElementById(x),W=c.width,H=c.height;let ball,targets=[],score=0,balls=3,level=1,best=+(localStorage.getItem('popup-pinball-best')||0),running=false,left=false,right=false,audio,last=0,combo=0;$('best').textContent=best;function tone(f,d=.05){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),a=audio.createGain();o.type='square';o.frequency.value=f;a.gain.value=.025;o.connect(a);a.connect(audio.destination);o.start();a.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}function hud(){$('score').textContent=score;$('balls').textContent=balls;$('level').textContent=level;$('best').textContent=best}function target(){const w=90+Math.random()*70,h=42+Math.random()*35;return{x:35+Math.random()*(W-w-70),y:70+Math.random()*300,w,h,hp:1+Math.floor(level/4),flash:0}}function fill(){while(targets.length<Math.min(5+level,11))targets.push(target())}function serve(){ball={x:W/2,y:H-100,vx:(Math.random()-.5)*170,vy:-330,r:9};combo=0}function reset(){score=0;balls=3;level=1;targets=[];serve();fill();running=true;last=performance.now();$('ov').hidden=true;$('msg').textContent='Taskbar flippers online.';hud()}function lose(){balls--;combo=0;tone(80,.16);if(balls<=0){running=false;if(score>best){best=score;localStorage.setItem('popup-pinball-best',best)}hud();$('card').innerHTML='<h2>PINBALL.EXE stopped</h2>Score: <b>'+score+'</b><br>Level: <b>'+level+'</b><br>Best: <b>'+best+'</b><br><button class="btn" id="again">PLAY AGAIN</button>';$('ov').hidden=false;document.getElementById('again').onclick=reset}else{serve();hud();$('msg').textContent='Ball lost. '+balls+' remaining.'}}function flap(x,y,side){const pivot=side<0?270:530,up=side<0?left:right,ang=(side<0?-.15:Math.PI+.15)+(up?(side<0?-.48:.48):0),len=115;const ex=pivot+Math.cos(ang)*len,ey=530+Math.sin(ang)*len;g.lineWidth=18;g.lineCap='round';g.strokeStyle=up?'#ffff00':'#c0c0c0';g.beginPath();g.moveTo(pivot,530);g.lineTo(ex,ey);g.stroke();const dx=ex-pivot,dy=ey-530,t=Math.max(0,Math.min(1,((x-pivot)*dx+(y-530)*dy)/(dx*dx+dy*dy))),px=pivot+t*dx,py=530+t*dy;return{x:px,y:py,d:Math.hypot(x-px,y-py),up,side}}function physics(dt){ball.vy+=460*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx);tone(180)}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);tone(180)}if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}for(let i=targets.length-1;i>=0;i--){const t=targets[i],cx=Math.max(t.x,Math.min(ball.x,t.x+t.w)),cy=Math.max(t.y,Math.min(ball.y,t.y+t.h));if(Math.hypot(ball.x-cx,ball.y-cy)<ball.r){t.hp--;t.flash=1;combo++;score+=100*Math.min(combo,8);ball.vy*=-1.03;ball.vx+=(ball.x-(t.x+t.w/2))*1.1;tone(300+combo*25);if(t.hp<=0)targets.splice(i,1);if(score>best)best=score;level=1+Math.floor(score/1800);fill();hud();break}}for(const side of [-1,1]){const f=flap(ball.x,ball.y,side);if(f.d<ball.r+13&&ball.vy>0){ball.vy=-Math.abs(ball.vy)*(f.up?1.12:.9)-90;ball.vx+=(ball.x-f.x)*2+(f.side<0?90:-90);tone(f.up?520:360)}}if(ball.y>H+25)lose()}function draw(){g.fillStyle='#001d38';g.fillRect(0,0,W,H);g.strokeStyle='#0b3c61';for(let x=0;x<W;x+=40){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(const t of targets){g.fillStyle=t.flash>0?'#ffffe1':'#c0c0c0';g.fillRect(t.x,t.y,t.w,t.h);g.strokeStyle='#fff';g.lineWidth=2;g.strokeRect(t.x,t.y,t.w,t.h);g.fillStyle='#000080';g.fillRect(t.x+2,t.y+2,t.w-4,13);g.fillStyle='#fff';g.font='10px monospace';g.fillText('error_'+t.hp+'.exe',t.x+5,t.y+12);t.flash=Math.max(0,t.flash-.08)}flap(ball.x,ball.y,-1);flap(ball.x,ball.y,1);g.shadowBlur=12;g.shadowColor='#00ffff';g.fillStyle='#fff';g.beginPath();g.arc(ball.x,ball.y,ball.r,0,Math.PI*2);g.fill();g.shadowBlur=0;g.fillStyle='#00ffff';g.font='12px monospace';g.fillText('COMBO x'+combo,12,22)}function loop(t){const dt=Math.min(.025,(t-last)/1000||0);last=t;if(running)physics(dt);draw();requestAnimationFrame(loop)}function key(e,v){const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a'){left=v;e.preventDefault()}if(k==='arrowright'||k==='d'){right=v;e.preventDefault()}}addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();((e.clientX-r.left)<r.width/2?left=true:right=true);e.preventDefault()});c.addEventListener('pointerup',()=>left=right=false);c.addEventListener('pointercancel',()=>left=right=false);$('start').onclick=reset;$('new').onclick=reset;serve();fill();hud();requestAnimationFrame(loop)})();</script></body></html>
