name: Deploy to GitHub Pages

# The site is plain files, so "build" is really just "upload the folder".
# The checks in games-ci.yml run first: the multiplayer games are the one
# part of this site that can break silently, and a broken sigil is not
# something you want to find out about from a stranger in the guestbook.

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    verify:
        uses: ./.github/workflows/games-ci.yml

    build:
        runs-on: ubuntu-latest
        needs: verify
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Pages
              uses: actions/configure-pages@v4

            # every tracked file except the source material in .pagesignore,
            # which would only make every deploy bigger and slower
            - name: Stage the site
              run: node .github/scripts/stage-pages.mjs _site

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: "_site"

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
