name: Sign the guestbook

# Signing used to open a pull request, which meant forking the repo
# first. Nobody forks a repo to say hello. Now the site opens a
# pre-filled issue and this commits it.
#
# `issues` and not `issue_comment`: the body is written once, by the
# person who opened it, and everything in it is treated as a string a
# stranger wrote — it reaches the script through the environment, never
# through a shell or a workflow expression.

on:
    issues:
        types: [opened, edited, reopened]

permissions:
    contents: write # to commit the entry
    issues: write # to answer and close the issue

concurrency:
    # entries are committed one at a time: two at once would race on the
    # same branch and one would lose
    group: guestbook-writes
    cancel-in-progress: false

jobs:
    sign:
        # cheap filter first, so an ordinary issue never starts a runner
        if: startsWith(github.event.issue.title, 'guestbook:') || startsWith(github.event.issue.title, 'shout:')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Add the entry
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
                  ISSUE_TITLE: ${{ github.event.issue.title }}
                  ISSUE_BODY: ${{ github.event.issue.body }}
                  ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
                  TARGET_BRANCH: ${{ github.event.repository.default_branch }}
              run: node .github/scripts/guestbook-bot.mjs
