name: Scan theme submissions

# every pull request that touches a submitted theme or an uploaded track is
# scanned server-side before a human looks at it. the job runs the same
# scanner the theme maker runs in the browser, plus a virustotal reputation
# lookup when the repo has a key configured.
#
# pull_request (not pull_request_target) on purpose: this checks out the
# contributor's branch, so it must never see repository secrets it could
# leak. VIRUSTOTAL_API_KEY is only read from the environment, and if the
# fork cannot see it the job degrades to the deterministic checks and says so.

on:
    pull_request:
        paths:
            - "data/themes/**"
            - "src/music/**"
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: write

jobs:
    scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout PR head
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Collect changed files
              id: changed
              run: |
                  BASE="${{ github.event.pull_request.base.sha }}"
                  HEAD="${{ github.event.pull_request.head.sha }}"
                  if [ -z "$BASE" ]; then
                    # workflow_dispatch: scan everything that exists
                    FILES=$(git ls-files 'data/themes/*.json' 'src/music/*' | tr '\n' ' ')
                  else
                    FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" "$HEAD" | tr '\n' ' ')
                  fi
                  echo "files=$FILES" >> "$GITHUB_OUTPUT"
                  echo "changed: $FILES"

            - name: Scan
              id: scan
              env:
                  VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
              run: node .github/scripts/scan-theme.mjs ${{ steps.changed.outputs.files }}

            - name: Comment the report on the PR
              if: always() && github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      if (!fs.existsSync('scan-report.md')) return;
                      const body = fs.readFileSync('scan-report.md', 'utf8')
                        + '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
                      const marker = '## theme submission scan';
                      const { owner, repo } = context.repo;
                      const issue_number = context.issue.number;
                      // update the existing report instead of stacking a new
                      // comment on every push
                      const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
                      const mine = comments.data.find(c => c.user.type === 'Bot' && c.body.includes(marker));
                      if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
                      else await github.rest.issues.createComment({ owner, repo, issue_number, body });
