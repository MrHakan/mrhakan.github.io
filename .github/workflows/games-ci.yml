name: Check the games

# The site has no build step, so nothing catches a broken game until
# somebody opens it. This does: it loads the real game files, checks the
# fifty spells and their sigils, proves the recogniser can still tell
# them apart when they are drawn badly, and makes sure the multiplayer
# relay still relays. Deploys wait for it — see deploy.yml.

on:
    push:
        branches: [main]
        paths:
            - "games/**"
            - "server/**"
            - "index.html"
            - "index.js"
            - "guestbook.html"
            - "guestbook.js"
            - "extras.js"
            - "style.css"
            - "sw.js"
            - "data/site.json"
            - ".github/scripts/**"
            - ".github/workflows/games-ci.yml"
    pull_request:
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    games:
        name: spells, sigils and wiring
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            # no npm install anywhere in here on purpose: the site has no
            # dependencies and neither does its test suite
            - name: Check spells, sigils and desktop wiring
              run: node .github/scripts/check-games.mjs

            - name: Smoke test the netplay relay
              run: node server/relay-smoke.mjs

            # the guestbook is a gist's comment thread, so it is the one
            # place a stranger's writing lands on the page. own tests.
            - name: Check the guestbook
              run: node .github/scripts/check-guestbook.mjs

            # the motion layer has one promise to keep — reduced motion
            # means no motion — and it is not visible when it breaks
            - name: Check the motion layer and the charts
              run: node .github/scripts/check-motion.mjs

            # the defragmenter moves clusters around a model of the site's
            # own files; the plan has to not lose any of them
            - name: Check the defragmenter
              run: node .github/scripts/check-defrag.mjs

            # the RPG has a design document it is supposed to obey and a set
            # of balance targets that no amount of eyeballing will hold: this
            # runs a few thousand fights and fails if any of them drift
            - name: Check echoes of the tide
              run: node .github/scripts/check-echoes.mjs

    browser:
        name: it actually opens in a browser
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install playwright chromium
              run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium

            - name: Boot the site, open the game, draw a sigil, run two lobbies
              env:
                  # the "public relays" transport is exercised against our own
                  # stand-in relay, so CI does not lean on strangers' servers
                  NOSTR_TEST_RELAY: ws://127.0.0.1:8790
              run: |
                  python3 -m http.server 8099 &
                  node server/nostr-test-relay.mjs &
                  sleep 2
                  node .github/scripts/browser-check.mjs

            # and the RPG, which is all DOM and two canvases: roll a
            # character, sail, fight, forge and put a line in the water
            - name: Play echoes of the tide
              run: |
                  python3 -m http.server 8098 &
                  sleep 2
                  SITE_URL=http://localhost:8098/index.html node .github/scripts/browser-echoes.mjs

            - name: Keep the screenshots
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: screenshots
                  path: .ci-shots/
                  if-no-files-found: ignore
                  retention-days: 7
