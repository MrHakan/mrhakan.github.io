<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#008080"><title>Hash Lab 98</title><style>:root{font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080}*{box-sizing:border-box}body{margin:0;padding:10px;background:#008080}.win{max-width:950px;margin:auto;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:5px 5px #004646}.title{display:flex;background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:5px}.title a{margin-left:auto;background:#c0c0c0;color:#000;text-decoration:none;border:2px solid;border-color:#fff #000 #000 #fff;padding:0 6px}.content{padding:10px}.tabs,.actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}button,select,input,textarea{font:12px "MS Sans Serif",sans-serif}button{background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;padding:7px 10px;font-weight:bold;cursor:pointer}button.active{border-color:#000 #fff #fff #000;background:#ddd}.panel{border:2px solid;border-color:#808080 #fff #fff #808080;background:#eee;padding:9px;margin-bottom:9px}.panel label{font-size:12px;font-weight:bold;display:block;margin-bottom:5px}textarea,input[type=text]{width:100%;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:8px;font-family:monospace}textarea{min-height:150px;resize:vertical}.drop{min-height:150px;background:#fff;border:2px dashed #808080;display:grid;place-items:center;text-align:center;padding:20px;font:13px monospace;cursor:pointer}.drop.drag{background:#ffffcc}.result{background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:9px;word-break:break-all;font:12px/1.5 monospace;min-height:58px}.row{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;margin:7px 0}.ok{background:#d8ffd8}.bad{background:#ffd8d8}.status{font:11px monospace;color:#333;margin-top:6px}@media(max-width:600px){body{padding:4px}.content{padding:6px}.row{grid-template-columns:1fr}}</style></head><body><main class="win"><div class="title">🔐 HASH LAB 98.EXE<a href="../../">×</a></div><div class="content"><div class="tabs"><button class="active" data-mode="text">TEXT</button><button data-mode="file">FILE</button></div><section class="panel"><div id="textMode"><label>TEXT INPUT</label><textarea id="text" placeholder="Type or paste text here…"></textarea></div><div id="fileMode" hidden><label>LOCAL FILE</label><div class="drop" id="drop">Drop a file here<br>or click to browse<input id="file" type="file" hidden></div></div><div class="row"><label>ALGORITHM</label><select id="alg"><option>SHA-256</option><option>SHA-384</option><option>SHA-512</option></select></div><div class="actions"><button id="hash">CALCULATE HASH</button><button id="copy">COPY</button><button id="clear">CLEAR</button></div><label>CHECKSUM</label><div class="result" id="out">Waiting for input…</div><div class="status" id="status">Web Crypto API · processing stays on this device.</div></section><section class="panel"><label>VERIFY AGAINST A KNOWN CHECKSUM</label><input id="expected" type="text" placeholder="Paste expected hexadecimal checksum"><div class="actions" style="margin-top:8px"><button id="verify">VERIFY</button></div><div class="result" id="verifyResult">No checksum comparison yet.</div></section></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),text=$('text'),file=$('file'),drop=$('drop'),out=$('out'),status=$('status'),expected=$('expected'),vr=$('verifyResult');let mode='text',selected=null,lastHash='';document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(q=>q.classList.toggle('active',q===b));$('textMode').hidden=mode!=='text';$('fileMode').hidden=mode!=='file'});drop.onclick=()=>file.click();file.onchange=()=>pick(file.files[0]);['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>pick(e.dataTransfer.files[0]));function pick(f){if(!f)return;selected=f;drop.innerHTML='<b>'+esc(f.name)+'</b><br>'+fmt(f.size)+' · '+(f.type||'unknown type')+'<br><small>Click to choose another file</small>';status.textContent='File selected. Nothing has been uploaded.'}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function fmt(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}async function calc(){try{let data;if(mode==='text')data=new TextEncoder().encode(text.value);else{if(!selected){status.textContent='Choose a file first.';return}data=await selected.arrayBuffer()}status.textContent='Calculating '+$('alg').value+'…';const h=await crypto.subtle.digest($('alg').value,data),a=[...new Uint8Array(h)];lastHash=a.map(b=>b.toString(16).padStart(2,'0')).join('');out.textContent=lastHash;status.textContent=$('alg').value+' complete · '+(mode==='file'?fmt(selected.size):new TextEncoder().encode(text.value).length+' bytes')+' · local only';vr.className='result';vr.textContent='No checksum comparison yet.'}catch(e){out.textContent='Hashing failed: '+e.message}}$('hash').onclick=calc;$('copy').onclick=async()=>{if(!lastHash)return;try{await navigator.clipboard.writeText(lastHash);status.textContent='Checksum copied to clipboard.'}catch(e){status.textContent='Clipboard unavailable — select the checksum manually.'}};$('clear').onclick=()=>{text.value='';selected=null;file.value='';drop.innerHTML='Drop a file here<br>or click to browse<input id="file2" type="file" hidden>';lastHash='';out.textContent='Waiting for input…';expected.value='';vr.textContent='No checksum comparison yet.';vr.className='result';status.textContent='Cleared.'};$('verify').onclick=()=>{if(!lastHash){vr.textContent='Calculate a hash first.';vr.className='result bad';return}const e=expected.value.trim().replace(/\s/g,'').toLowerCase();if(!e){vr.textContent='Paste an expected checksum first.';vr.className='result bad';return}const ok=e===lastHash;vr.textContent=ok?'✓ MATCH — checksums are identical.':'✗ MISMATCH — file/text does not match the expected checksum.';vr.className='result '+(ok?'ok':'bad')};text.addEventListener('input',()=>{lastHash='';out.textContent='Input changed — recalculate hash.'})})();</script></body></html>
