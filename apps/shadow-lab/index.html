<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><title>Shadow Lab 98</title><meta name="description" content="Build layered CSS box shadows visually and copy production-ready CSS entirely in your browser."><link rel="canonical" href="https://mrhakan.github.io/apps/shadow-lab/"><meta property="og:title" content="Shadow Lab 98"><meta property="og:description" content="A local visual CSS box-shadow builder with layered shadows and presets."><meta property="og:type" content="website"><meta property="og:url" content="https://mrhakan.github.io/apps/shadow-lab/"><style>/* Playground focus visibility */*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080}body{min-height:100vh;display:grid;place-items:center;padding:14px}.win{width:min(900px,100%);background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:7px 7px #004040;padding:3px}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:6px 8px;display:flex;justify-content:space-between}.title a{color:#000;background:#c0c0c0;text-decoration:none;padding:0 6px;border:2px solid;border-color:#fff #444 #444 #fff}.body{padding:12px}.layout{display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,1fr);gap:12px}.panel{border:2px inset #ddd;padding:10px;background:#d4d0c8}.preview{min-height:330px;display:grid;place-items:center;background:#f5f5f5;border:2px inset #ddd}.box{width:150px;height:150px;background:#c0c0c0;border:2px solid;border-color:#fff #444 #444 #fff;display:grid;place-items:center;font-weight:bold}.row{display:grid;grid-template-columns:80px 1fr 52px;gap:6px;align-items:center;margin:7px 0;font-size:12px}.row input[type=number]{width:52px}.layer{padding:7px;border:1px solid #808080;margin-bottom:8px;background:#eee}.layer-head{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:12px}.btn{background:#c0c0c0;border:2px solid;border-color:#fff #444 #444 #fff;padding:6px 10px;font-weight:bold;min-height:34px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.code{width:100%;min-height:78px;margin-top:9px;font:12px monospace;padding:7px;background:#fff;border:2px inset #ddd}.presets{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.status{font:12px monospace;background:#ffffe1;border:1px solid #808080;padding:7px;margin-top:8px}:where(a,button,input,textarea):focus-visible{outline:2px solid #f0f;outline-offset:2px}@media(max-width:680px){body{padding:6px}.body{padding:8px}.layout{grid-template-columns:1fr}.preview{min-height:250px}.row{grid-template-columns:70px 1fr 48px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</head><body><main class="win"><div class="title"><h1 class="page-heading">▣ SHADOW LAB 98.EXE</h1><a href="../../" aria-label="Back to Playground">×</a></div><div class="body"><div class="presets" aria-label="Shadow presets"><button type="button" class="btn preset" data-p="soft">SOFT</button><button type="button" class="btn preset" data-p="float">FLOAT</button><button type="button" class="btn preset" data-p="retro">RETRO</button><button type="button" class="btn preset" data-p="neon">NEON</button></div><div class="layout"><section class="panel"><div id="layers"></div><button type="button" class="btn" id="add">+ ADD LAYER</button><div class="actions"><button type="button" class="btn" id="copy">COPY CSS</button><button type="button" class="btn" id="reset">RESET</button></div><textarea id="code" class="code" readonly aria-label="Generated CSS"></textarea><div id="status" class="status" role="status" aria-live="polite">All processing stays in this browser.</div></section><section class="preview" aria-label="Shadow preview"><div id="box" class="box">PREVIEW</div></section></div></div></main><script>(()=>{'use strict';const layersEl=document.getElementById('layers'),box=document.getElementById('box'),code=document.getElementById('code'),status=document.getElementById('status');let layers=[];const defaults=()=>[{x:8,y:8,blur:16,spread:0,color:'#000000',alpha:.28,inset:false}];function hexRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}function css(){return layers.map(l=>{const [r,g,b]=hexRgb(l.color);return `${l.inset?'inset ':''}${l.x}px ${l.y}px ${l.blur}px ${l.spread}px rgba(${r}, ${g}, ${b}, ${l.alpha})`}).join(',\n  ')}function update(){const v=css();box.style.boxShadow=v;code.value='box-shadow: '+(v?'\n  '+v:'none')+';'}function render(){layersEl.innerHTML='';layers.forEach((l,i)=>{const d=document.createElement('div');d.className='layer';d.innerHTML=`<div class="layer-head"><span>LAYER ${i+1}</span><button type="button" class="btn remove" aria-label="Remove layer ${i+1}">×</button></div>${[['X','x',-50,50],['Y','y',-50,50],['BLUR','blur',0,100],['SPREAD','spread',-30,50]].map(([n,k,min,max])=>`<label class="row"><span>${n}</span><input data-k="${k}" type="range" min="${min}" max="${max}" value="${l[k]}"><input data-k="${k}" type="number" min="${min}" max="${max}" value="${l[k]}"></label>`).join('')}<label class="row"><span>COLOR</span><input data-k="color" type="color" value="${l.color}"><span></span></label><label class="row"><span>OPACITY</span><input data-k="alpha" type="range" min="0" max="1" step=".01" value="${l.alpha}"><input data-k="alpha" type="number" min="0" max="1" step=".01" value="${l.alpha}"></label><label><input data-k="inset" type="checkbox" ${l.inset?'checked':''}> inset shadow</label>`;d.querySelector('.remove').onclick=()=>{layers.splice(i,1);render()};d.querySelectorAll('input[data-k]').forEach(inp=>inp.oninput=()=>{const k=inp.dataset.k,v=k==='inset'?inp.checked:k==='color'?inp.value:+inp.value;layers[i][k]=v;d.querySelectorAll(`[data-k="${k}"]`).forEach(other=>{if(other!==inp){if(k==='inset')other.checked=v;else other.value=v}});update()});layersEl.appendChild(d)});update()}function setPreset(p){const P={soft:[{x:0,y:10,blur:30,spread:0,color:'#000000',alpha:.18,inset:false}],float:[{x:0,y:18,blur:35,spread:-8,color:'#000000',alpha:.35,inset:false},{x:0,y:4,blur:8,spread:0,color:'#000000',alpha:.16,inset:false}],retro:[{x:10,y:10,blur:0,spread:0,color:'#000080',alpha:1,inset:false}],neon:[{x:0,y:0,blur:12,spread:2,color:'#00ffff',alpha:.9,inset:false},{x:0,y:0,blur:28,spread:4,color:'#ff00ff',alpha:.55,inset:false}]};layers=P[p].map(x=>({...x}));render()}document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>setPreset(b.dataset.p));document.getElementById('add').onclick=()=>{if(layers.length>=6){status.textContent='Maximum six layers.';return}layers.push({x:4,y:4,blur:8,spread:0,color:'#000000',alpha:.25,inset:false});render()};document.getElementById('reset').onclick=()=>{layers=defaults();render();status.textContent='Reset to default shadow.'};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code.value);status.textContent='CSS copied to clipboard.'}catch{code.select();status.textContent='Clipboard unavailable; CSS selected for manual copy.'}};layers=defaults();render()})();</script></body></html>
