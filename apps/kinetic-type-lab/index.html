<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#008080">
<title>Kinetic Type Lab</title>
<style>
:root{font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080;color:#000}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#008080}body{padding:12px}.win{max-width:1040px;margin:auto;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:3px 3px 0 #000}.bar{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:700;padding:4px;display:flex;justify-content:space-between}.bar a{color:#000;background:#c0c0c0;text-decoration:none;border:2px solid;border-color:#fff #000 #000 #fff;padding:0 6px}.grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:10px;padding:10px}.panel{border:2px solid;border-color:#808080 #fff #fff #808080;padding:8px}.group{margin-bottom:10px}.group h2{font-size:12px;margin:0 0 6px}.row{display:grid;grid-template-columns:92px 1fr;gap:7px;align-items:center;font-size:12px;margin:6px 0}.row input,.row select,.row textarea{width:100%;font:12px inherit;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:4px}.row textarea{resize:vertical;min-height:58px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.btn{appearance:none;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:1px 1px 0 #000;padding:7px;font:700 12px inherit;cursor:pointer}.btn:active{border-color:#000 #fff #fff #000;transform:translate(1px,1px);box-shadow:none}.stage{min-width:0}.canvasWrap{background:#222;border:2px solid;border-color:#808080 #fff #fff #808080;min-height:520px;display:grid;place-items:center;padding:10px;overflow:auto}canvas{display:block;max-width:100%;height:auto;box-shadow:0 0 0 1px #000}.status{margin-top:7px;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:6px;font-size:11px}.swatches{display:flex;gap:5px}.swatches button{width:34px;height:24px;border:2px solid;border-color:#fff #000 #000 #fff;cursor:pointer}@media(max-width:760px){body{padding:5px}.grid{grid-template-columns:1fr}.stage{order:1}.panel{order:2}.canvasWrap{min-height:300px}.buttons{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<main class="win"><div class="bar"><span>🔤 KINETIC TYPE LAB.EXE</span><a href="../../">×</a></div><div class="grid">
<section class="panel"><div class="group"><h2>TEXT</h2><label class="row"><span>Words</span><textarea id="text">MAKE THE WEB
WEIRD AGAIN</textarea></label><label class="row"><span>Font</span><select id="font"><option value="Impact">Impact</option><option value="Arial Black">Arial Black</option><option value="Courier New">Courier New</option><option value="Georgia">Georgia</option></select></label></div>
<div class="group"><h2>MOTION / LAYOUT</h2><label class="row"><span>Size</span><input id="size" type="range" min="32" max="150" value="86"></label><label class="row"><span>Tracking</span><input id="tracking" type="range" min="0" max="30" value="4"></label><label class="row"><span>Wave</span><input id="wave" type="range" min="0" max="80" value="26"></label><label class="row"><span>Speed</span><input id="speed" type="range" min="0" max="100" value="34"></label><label class="row"><span>Rotate</span><input id="rotate" type="range" min="-20" max="20" value="-4"></label><label class="row"><span>Grid</span><select id="grid"><option value="1">1×</option><option value="2">2×2</option><option value="3">3×3</option></select></label></div>
<div class="group"><h2>PALETTE</h2><div class="swatches" id="swatches"></div></div><div class="buttons"><button class="btn" id="play">PAUSE</button><button class="btn" id="random">RANDOMIZE</button><button class="btn" id="png">SAVE PNG</button><button class="btn" id="square">SQUARE / WIDE</button></div><p style="font-size:11px;line-height:1.45">Everything renders locally with Canvas. No account, upload, API, or backend.</p></section>
<section class="stage"><div class="canvasWrap"><canvas id="c" width="900" height="900"></canvas></div><div class="status" id="status">900×900 live poster · PNG export uses the current frame.</div></section>
</div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d');let playing=true,t0=performance.now(),wide=false,palette=0;
const palettes=[['#0b0b18','#f6f2e8','#ff4d7d','#55d7ff'],['#101b10','#c7f9cc','#57cc99','#22577a'],['#fff6d8','#111111','#ff3b30','#0066ff'],['#180b2c','#f8d8ff','#ff7a00','#00e5ff'],['#e7e7e7','#111','#777','#fff']];
function colorButtons(){const box=$('swatches');box.innerHTML='';palettes.forEach((p,i)=>{const b=document.createElement('button');b.title='palette '+(i+1);b.style.background=`linear-gradient(90deg,${p.join(',')})`;b.onclick=()=>{palette=i;draw(performance.now())};box.appendChild(b)})}
function letterLine(text,cx,cy,size,tracking,wave,phase,rot,font,fg,accent){const chars=[...text];const widths=chars.map(ch=>x.measureText(ch).width+tracking),total=widths.reduce((a,b)=>a+b,0)-tracking;let px=cx-total/2;x.save();x.translate(cx,cy);x.rotate(rot);x.translate(-cx,-cy);chars.forEach((ch,i)=>{const w=widths[i],yy=cy+Math.sin(i*.75+phase)*wave;x.fillStyle=i%5===0?accent:fg;x.fillText(ch,px,yy);px+=w});x.restore()}
function draw(now){const p=palettes[palette],bg=p[0],fg=p[1],a=p[2],b=p[3];x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);const size=+$('size').value,tracking=+$('tracking').value,wave=+$('wave').value,spd=+$('speed').value/9000,rot=+$('rotate').value*Math.PI/180,font=$('font').value,g=+$('grid').value,lines=($('text').value||'TYPE').split(/\n/).slice(0,4),phase=(now-t0)*spd;x.textBaseline='middle';x.textAlign='left';x.font=`900 ${size/g}px "${font}"`;
 const cw=c.width/g,ch=c.height/g;for(let gy=0;gy<g;gy++)for(let gx=0;gx<g;gx++){const ox=gx*cw,oy=gy*ch;x.save();x.beginPath();x.rect(ox,oy,cw,ch);x.clip();x.globalAlpha=.09;x.strokeStyle=b;for(let q=-c.height;q<c.width+c.height;q+=44){x.beginPath();x.moveTo(q+phase*70+ox,oy);x.lineTo(q-c.height+phase*70+ox,oy+ch);x.stroke()}x.globalAlpha=1;const lh=(size/g)*1.12;const start=oy+ch/2-(lines.length-1)*lh/2;lines.forEach((line,j)=>letterLine(line,ox+cw/2,start+j*lh,size/g,tracking/g,wave/g,phase+j*.8,rot*(j%2?-.65:1),font,j%2?fg:b,j%2?a:fg));x.restore()}
 x.fillStyle=a;x.fillRect(0,c.height-12,c.width,12);x.fillStyle=b;x.fillRect(0,0,12,c.height)}
function loop(now){draw(now);if(playing)requestAnimationFrame(loop)}
for(const id of ['text','font','size','tracking','wave','speed','rotate','grid'])$(id).addEventListener('input',()=>draw(performance.now()));$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'PAUSE':'PLAY';if(playing)requestAnimationFrame(loop)};$('random').onclick=()=>{palette=Math.floor(Math.random()*palettes.length);$('size').value=48+Math.floor(Math.random()*90);$('tracking').value=Math.floor(Math.random()*18);$('wave').value=Math.floor(Math.random()*65);$('speed').value=10+Math.floor(Math.random()*80);$('rotate').value=-12+Math.floor(Math.random()*25);$('grid').value=1+Math.floor(Math.random()*3);draw(performance.now())};$('png').onclick=()=>{draw(performance.now());const a=document.createElement('a');a.download='kinetic-type-'+Date.now()+'.png';a.href=c.toDataURL('image/png');a.click();$('status').textContent='PNG exported locally.'};$('square').onclick=()=>{wide=!wide;c.width=wide?1200:900;c.height=wide?675:900;$('status').textContent=(wide?'1200×675 wide':'900×900 square')+' live poster · PNG export uses the current frame.';draw(performance.now())};colorButtons();requestAnimationFrame(loop)})();
</script></body></html>
