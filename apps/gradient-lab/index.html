<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><meta name="description" content="Design linear, radial and conic CSS gradients, then copy CSS or export a PNG.">
<link rel="canonical" href="https://mrhakan.github.io/apps/gradient-lab/">
<meta property="og:type" content="website">
<meta property="og:title" content="Gradient Lab 98">
<meta property="og:description" content="Design linear, radial and conic CSS gradients, then copy CSS or export a PNG.">
<meta property="og:url" content="https://mrhakan.github.io/apps/gradient-lab/">
<title>Gradient Lab 98</title><style>*{box-sizing:border-box}body{margin:0;padding:8px;background:#008080;font:12px 'MS Sans Serif',Tahoma,sans-serif}.win{max-width:920px;margin:auto;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff}.title{background:#000080;color:#fff;font-weight:bold;padding:5px;display:flex}.title a{margin-left:auto;background:#c0c0c0;color:#000;text-decoration:none;padding:0 5px}.grid{display:grid;grid-template-columns:300px 1fr;gap:9px;padding:9px}.group{border:2px groove #fff;padding:8px;margin-bottom:8px}.row{display:grid;grid-template-columns:90px 1fr;gap:7px;align-items:center;margin:7px 0}input,select,textarea,button{font:inherit}input[type=color],select,input[type=range],textarea{width:100%}button{background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;padding:7px;font-weight:bold}.preview{min-height:420px;border:2px inset #fff;position:relative}.preview:after{content:'GRADIENT PREVIEW';position:absolute;left:10px;bottom:10px;background:#c0c0c0;padding:5px;border:1px solid #000}.code{width:100%;height:115px;background:#fff;border:2px inset #fff;padding:8px;font-family:monospace}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.swatches button{height:38px;padding:0}@media(max-width:700px){.grid{grid-template-columns:1fr}.preview{min-height:300px}.controls{order:2}.out{order:1}}
:focus-visible{outline:2px solid #000080;outline-offset:2px}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0ms!important}
}
</style></head><body><main class="win"><div class="title">🌈 GRADIENT LAB 98.EXE<a href="../../">×</a></div><div class="grid"><section class="controls"><div class="group"><b>GRADIENT</b><label class="row"><span>Type</span><select id="type"><option value="linear">Linear</option><option value="radial">Radial</option><option value="conic">Conic</option></select></label><label class="row" id="angleRow"><span>Angle</span><input id="angle" type="range" min="0" max="360" value="135"></label><label class="row"><span>Color A</span><input id="a" type="color" value="#000080"></label><label class="row"><span>Color B</span><input id="b" type="color" value="#00ffff"></label><label class="row"><span>Color C</span><input id="c" type="color" value="#ff00ff"></label><label class="row"><span>Mid A</span><input id="p1" type="range" min="0" max="80" value="45"></label><label class="row"><span>Mid B</span><input id="p2" type="range" min="20" max="100" value="75"></label></div><div class="group"><b>PRESETS</b><div class="swatches" id="presets"></div></div><div class="actions"><button id="random">🎲 RANDOMIZE</button><button id="swap">⇄ SWAP</button><button id="copy">📋 COPY CSS</button><button id="png">💾 SAVE PNG</button></div></section><section class="out"><div id="preview" class="preview"></div><textarea id="code" class="code" readonly></textarea><p>Pure CSS gradient designer. No uploads, API calls, tracking, or backend. PNG export is rendered locally.</p></section></div></main><script>(()=>{'use strict';const $=x=>document.getElementById(x),els=['type','angle','a','b','c','p1','p2'].map($),P=$('preview'),C=$('code');const presets=[['#000080','#00ffff','#ffffff'],['#ff5f6d','#ffc371','#fff5cc'],['#120078','#9d0191','#fd3a69'],['#001219','#0a9396','#ee9b00'],['#111827','#7c3aed','#ec4899'],['#0b3d0b','#76b947','#d9ed92'],['#3a0ca3','#4361ee','#4cc9f0'],['#2b2d42','#8d99ae','#edf2f4']];function css(){let t=$('type').value,x=`${$('a').value} 0%, ${$('b').value} ${$('p1').value}%, ${$('c').value} ${$('p2').value}%`;return t==='linear'?`linear-gradient(${$('angle').value}deg, ${x})`:t==='radial'?`radial-gradient(circle at center, ${x})`:`conic-gradient(from ${$('angle').value}deg, ${x})`}function render(){let g=css();P.style.background=g;C.value=`background: ${g};`; $('angleRow').style.opacity=$('type').value==='radial'?'.45':'1'}els.forEach(e=>e.oninput=render);let box=$('presets');presets.forEach(p=>{let x=document.createElement('button');x.style.background=`linear-gradient(135deg,${p.join(',')})`;x.title=p.join(' / ');x.onclick=()=>{[$('a').value,$('b').value,$('c').value]=p;render()};box.appendChild(x)});$('random').onclick=()=>{for(let id of ['a','b','c'])$(id).value='#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');$('angle').value=Math.floor(Math.random()*361);$('p1').value=25+Math.floor(Math.random()*31);$('p2').value=60+Math.floor(Math.random()*31);render()};$('swap').onclick=()=>{let x=$('a').value;$('a').value=$('c').value;$('c').value=x;render()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(C.value);$('copy').textContent='✓ COPIED';setTimeout(()=>$('copy').textContent='📋 COPY CSS',900)}catch(e){C.select();document.execCommand('copy')}};$('png').onclick=()=>{let cv=document.createElement('canvas');cv.width=1600;cv.height=900;let ctx=cv.getContext('2d'),g,stops=[[0,$('a').value],[+$('p1').value/100,$('b').value],[+$('p2').value/100,$('c').value]];if($('type').value==='radial')g=ctx.createRadialGradient(800,450,0,800,450,900);else if($('type').value==='conic'&&ctx.createConicGradient)g=ctx.createConicGradient(+$('angle').value*Math.PI/180,800,450);else{let r=+$('angle').value*Math.PI/180,dx=Math.cos(r)*900,dy=Math.sin(r)*900;g=ctx.createLinearGradient(800-dx,450-dy,800+dx,450+dy)}stops.forEach(s=>g.addColorStop(Math.min(1,s[0]),s[1]));ctx.fillStyle=g;ctx.fillRect(0,0,1600,900);let a=document.createElement('a');a.download='gradient-lab.png';a.href=cv.toDataURL('image/png');a.click()};render()})();</script></body></html>
