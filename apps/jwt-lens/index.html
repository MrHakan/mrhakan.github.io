<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><title>JWT Lens 98</title><meta name="description" content="Inspect JWT headers, payloads and expiry locally without sending tokens anywhere."><link rel="canonical" href="https://mrhakan.github.io/apps/jwt-lens/"><meta property="og:title" content="JWT Lens 98"><meta property="og:description" content="Decode and inspect JSON Web Tokens entirely in your browser."><meta property="og:type" content="website"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080}body{min-height:100vh;display:grid;place-items:center;padding:12px}.win{width:min(850px,100%);background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:7px 7px #004040;padding:3px}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:6px 8px;display:flex;justify-content:space-between}.title a{color:#000;background:#c0c0c0;text-decoration:none;padding:0 6px;border:2px solid;border-color:#fff #444 #444 #fff}.body{padding:10px}label{display:block;font-size:12px;font-weight:bold;margin:7px 0 3px}textarea,pre{width:100%;border:2px inset #ddd;background:#fff;padding:8px;font:12px/1.45 monospace;white-space:pre-wrap;overflow-wrap:anywhere}textarea{min-height:100px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}pre{min-height:150px;margin:0}.btn{background:#c0c0c0;border:2px solid;border-color:#fff #444 #444 #fff;padding:7px 12px;font-weight:bold;margin-right:5px}.status{margin-top:8px;background:#ffffe1;border:1px solid #808080;padding:8px;font:12px monospace;min-height:34px}.warn{font-size:11px;line-height:1.4}/* Playground focus visibility */:where(a,button,textarea):focus-visible{outline:2px solid #f0f;outline-offset:2px}@media(max-width:600px){body{padding:5px}.grid{grid-template-columns:1fr}pre{min-height:110px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main class="win"><div class="title"><span>🔎 JWT LENS 98.EXE</span><a href="../../" aria-label="Back to Playground">×</a></div><div class="body"><label for="token">JWT</label><textarea id="token" spellcheck="false" placeholder="Paste header.payload.signature"></textarea><p><button type="button" class="btn" id="decode">DECODE</button><button type="button" class="btn" id="clear">CLEAR</button></p><div class="grid"><section><label>HEADER</label><pre id="header">—</pre></section><section><label>PAYLOAD</label><pre id="payload">—</pre></section></div><div id="status" class="status" aria-live="polite">Nothing leaves this browser.</div><p class="warn"><b>Inspector only:</b> decoding is not signature verification. Never treat an unverified token as trustworthy.</p></div></main><script>(()=>{'use strict';const t=document.getElementById('token'),h=document.getElementById('header'),p=document.getElementById('payload'),s=document.getElementById('status');function dec(v){v=v.replace(/-/g,'+').replace(/_/g,'/');v+='='.repeat((4-v.length%4)%4);const bytes=Uint8Array.from(atob(v),c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}document.getElementById('decode').onclick=()=>{try{const a=t.value.trim().split('.');if(a.length!==3)throw Error('JWT must contain exactly 3 dot-separated parts.');const head=dec(a[0]),pay=dec(a[1]);h.textContent=JSON.stringify(head,null,2);p.textContent=JSON.stringify(pay,null,2);let bits=['Decoded locally'];if(pay.exp){const d=new Date(pay.exp*1000);bits.push((Date.now()>d?'EXPIRED':'expires')+' '+d.toLocaleString())}if(pay.iat)bits.push('issued '+new Date(pay.iat*1000).toLocaleString());s.textContent=bits.join(' · ')}catch(e){h.textContent=p.textContent='—';s.textContent='ERROR: '+e.message}};document.getElementById('clear').onclick=()=>{t.value='';h.textContent=p.textContent='—';s.textContent='Cleared.'}})();</script></body></html>
