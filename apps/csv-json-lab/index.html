<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><title>CSV JSON Lab 98</title><meta name="description" content="Convert CSV and JSON locally with previews, delimiter controls and clipboard export."><link rel="canonical" href="https://mrhakan.github.io/apps/csv-json-lab/"><meta property="og:title" content="CSV JSON Lab 98"><meta property="og:description" content="Private browser-only CSV and JSON conversion."><meta property="og:type" content="website"><meta property="og:url" content="https://mrhakan.github.io/apps/csv-json-lab/"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080}body{min-height:100vh;display:grid;place-items:center;padding:12px}.win{width:min(980px,100%);background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:7px 7px #004040;padding:3px}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:6px 8px;display:flex;justify-content:space-between}.title a{color:#000;background:#c0c0c0;text-decoration:none;padding:0 6px;border:2px solid;border-color:#fff #444 #444 #fff}.body{padding:12px}.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.btn,select{background:#c0c0c0;border:2px solid;border-color:#fff #444 #444 #fff;padding:6px 10px;min-height:34px;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pane label{display:block;font-size:12px;font-weight:bold;margin-bottom:4px}.pane textarea{width:100%;min-height:330px;resize:vertical;border:2px inset #ddd;padding:8px;font:13px/1.45 monospace;background:#fff}.status{margin-top:8px;background:#ffffe1;border:1px solid #808080;padding:8px;font:12px monospace;min-height:34px}/* Playground focus visibility */:where(a,button,select,textarea):focus-visible{outline:2px solid #f0f;outline-offset:2px}@media(max-width:680px){body{padding:5px}.body{padding:8px}.grid{grid-template-columns:1fr}.pane textarea{min-height:220px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main class="win"><div class="title"><span>▤ CSV ↔ JSON LAB 98.EXE</span><a href="../../" aria-label="Back to Playground">×</a></div><div class="body"><div class="bar"><button type="button" class="btn" id="tojson">CSV → JSON</button><button type="button" class="btn" id="tocsv">JSON → CSV</button><label>Delimiter <select id="delim" aria-label="CSV delimiter"><option value=",">Comma</option><option value=";">Semicolon</option><option value="\t">Tab</option></select></label><button type="button" class="btn" id="copy">COPY OUTPUT</button><button type="button" class="btn" id="swap">SWAP</button></div><div class="grid"><div class="pane"><label for="input">INPUT</label><textarea id="input" spellcheck="false" placeholder="Paste CSV or JSON here..."></textarea></div><div class="pane"><label for="output">OUTPUT</label><textarea id="output" readonly spellcheck="false"></textarea></div></div><div id="status" class="status" role="status" aria-live="polite">Nothing is uploaded. Conversion runs entirely in this browser.</div></div></main><script>(()=>{'use strict';const input=document.getElementById('input'),output=document.getElementById('output'),status=document.getElementById('status'),delim=document.getElementById('delim');function d(){return delim.value==='\\t'?'\t':delim.value}function parseLine(s,sep){const a=[];let q=false,v='';for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){v+='"';i++}else q=!q}else if(c===sep&&!q){a.push(v);v=''}else v+=c}a.push(v);return a}function csvJson(){try{const lines=input.value.replace(/\r/g,'').split('\n').filter((x,i,a)=>x.length||i<a.length-1);if(lines.length<1)throw Error('CSV is empty');const h=parseLine(lines[0],d());const rows=lines.slice(1).map(line=>{const v=parseLine(line,d()),o={};h.forEach((k,i)=>o[k]=v[i]??'');return o});output.value=JSON.stringify(rows,null,2);status.textContent=`Converted ${rows.length} rows and ${h.length} columns.`}catch(e){status.textContent='CSV error: '+e.message}}function quote(v,sep){v=v==null?'':String(v);return /["\n\r]/.test(v)||v.includes(sep)?'"'+v.replaceAll('"','""')+'"':v}function jsonCsv(){try{const data=JSON.parse(input.value);if(!Array.isArray(data)||!data.every(x=>x&&typeof x==='object'&&!Array.isArray(x)))throw Error('Expected an array of objects');const keys=[...new Set(data.flatMap(Object.keys))],sep=d();output.value=[keys.map(x=>quote(x,sep)).join(sep),...data.map(r=>keys.map(k=>quote(r[k],sep)).join(sep))].join('\n');status.textContent=`Converted ${data.length} objects and ${keys.length} columns.`}catch(e){status.textContent='JSON error: '+e.message}}document.getElementById('tojson').onclick=csvJson;document.getElementById('tocsv').onclick=jsonCsv;document.getElementById('swap').onclick=()=>{input.value=output.value;output.value='';status.textContent='Output moved to input.'};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(output.value);status.textContent='Output copied.'}catch{output.select();status.textContent='Clipboard unavailable; output selected.'}}})();</script></body></html>
