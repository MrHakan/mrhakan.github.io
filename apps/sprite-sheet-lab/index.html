<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#008080"><meta name="description" content="Slice local sprite sheets into frames, preview cells and export selected frames as PNG.">

<title>Sprite Sheet Lab 98</title><style>:root{font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080}*{box-sizing:border-box}body{margin:0;padding:10px;background:#008080;min-height:100vh}.win{max-width:1050px;margin:auto;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:5px 5px #004040}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:5px;display:flex}.title a{margin-left:auto;color:#000;background:#c0c0c0;text-decoration:none;border:2px solid;border-color:#fff #000 #000 #fff;padding:0 6px}.layout{display:grid;grid-template-columns:270px 1fr;gap:10px;padding:10px}.group{border:2px solid;border-color:#808080 #fff #fff #808080;padding:8px;margin-bottom:8px}.group h2{font-size:12px;margin:0 0 8px}.row{display:grid;grid-template-columns:90px 1fr;gap:6px;align-items:center;margin:7px 0;font-size:12px}.row input{width:100%;min-width:0}.btn{width:100%;margin:3px 0;padding:7px;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;font-weight:bold;cursor:pointer}.btn:active{border-color:#000 #fff #fff #000}.drop{border:2px dashed #555;background:#eee;padding:15px;text-align:center;font-size:12px}.drop.drag{background:#fff}.view{background:#444;border:2px solid;border-color:#808080 #fff #fff #808080;padding:8px;overflow:auto;min-height:440px;display:grid;place-items:center}.view canvas{max-width:100%;height:auto;image-rendering:pixelated;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0/16px 16px;touch-action:none;cursor:crosshair}.status{margin-top:8px;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:7px;font:12px monospace}.preview{display:grid;grid-template-columns:96px 1fr;gap:8px;margin-top:8px}.preview canvas{width:96px;height:96px;object-fit:contain;image-rendering:pixelated;background:#fff;border:2px solid #808080}.note{font-size:10px;line-height:1.4;color:#333}@media(max-width:720px){body{padding:5px}.layout{grid-template-columns:1fr;padding:6px}.view{min-height:280px}.controls{order:2}.work{order:1}}
:focus-visible{outline:2px solid #000080;outline-offset:2px}

</style></head><body><main class="win"><div class="title">🧩 SPRITE SHEET LAB 98.EXE <a href="../../" aria-label="back">×</a></div><div class="layout"><section class="controls"><div class="group"><h2>IMAGE</h2><div class="drop" id="drop">Drop a sprite sheet here<br>or <button class="btn" id="open">OPEN IMAGE…</button></div><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></div><div class="group"><h2>GRID</h2><label class="row"><span>Columns</span><input id="cols" type="number" min="1" max="64" value="4"></label><label class="row"><span>Rows</span><input id="rows" type="number" min="1" max="64" value="4"></label><label class="row"><span>Margin px</span><input id="margin" type="number" min="0" max="256" value="0"></label><label class="row"><span>Spacing px</span><input id="spacing" type="number" min="0" max="256" value="0"></label></div><div class="group"><h2>SELECTED FRAME</h2><button class="btn" id="prev">← PREVIOUS</button><button class="btn" id="next">NEXT →</button><button class="btn" id="save">SAVE FRAME PNG</button><button class="btn" id="copy">COPY FRAME PNG</button><p class="note">Everything stays on your device. Click any cell to select it. Grid math supports margins and spacing.</p></div></section><section class="work"><div class="view"><canvas id="sheet" width="640" height="400" aria-label="sprite sheet preview"></canvas></div><div class="preview"><canvas id="frame" width="96" height="96"></canvas><div class="status" id="status">Open an image to begin.</div></div></section></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('sheet'),ctx=cv.getContext('2d'),pv=$('frame'),pctx=pv.getContext('2d'),file=$('file'),drop=$('drop'),status=$('status');let img=null,index=0,url='';function vals(){return{c:Math.max(1,Math.min(64,+$('cols').value||1)),r:Math.max(1,Math.min(64,+$('rows').value||1)),m:Math.max(0,+$('margin').value||0),s:Math.max(0,+$('spacing').value||0)}}function rect(i){const v=vals(),usableW=img.width-v.m*2-v.s*(v.c-1),usableH=img.height-v.m*2-v.s*(v.r-1),w=usableW/v.c,h=usableH/v.r,x=i%v.c,y=Math.floor(i/v.c);return{x:v.m+x*(w+v.s),y:v.m+y*(h+v.s),w,h,total:v.c*v.r}}function draw(){ctx.clearRect(0,0,cv.width,cv.height);if(!img)return;cv.width=img.width;cv.height=img.height;ctx.drawImage(img,0,0);const v=vals();index=Math.max(0,Math.min(v.c*v.r-1,index));ctx.save();ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=Math.max(1,img.width/500);for(let i=0;i<v.c*v.r;i++){const q=rect(i);ctx.strokeStyle=i===index?'#ff00ff':'rgba(255,255,255,.75)';ctx.lineWidth=i===index?3:1;ctx.strokeRect(q.x+.5,q.y+.5,q.w-1,q.h-1)}ctx.restore();drawFrame()}function drawFrame(){if(!img)return;const q=rect(index);pctx.clearRect(0,0,pv.width,pv.height);pctx.imageSmoothingEnabled=false;pctx.drawImage(img,q.x,q.y,q.w,q.h,0,0,pv.width,pv.height);status.textContent='Frame '+(index+1)+'/'+q.total+' · source '+Math.round(q.w)+'×'+Math.round(q.h)+' px · x '+Math.round(q.x)+', y '+Math.round(q.y)}function load(f){if(!f||!f.type.startsWith('image/'))return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);const n=new Image();n.onload=()=>{img=n;index=0;draw();status.textContent+=' · '+f.name};n.onerror=()=>status.textContent='Could not decode that image.';n.src=url}$('open').onclick=()=>file.click();file.onchange=()=>load(file.files[0]);['cols','rows','margin','spacing'].forEach(id=>$(id).addEventListener('input',()=>{index=0;draw()}));['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>load(e.dataTransfer.files[0]));cv.addEventListener('pointerdown',e=>{if(!img)return;const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)*cv.width/b.width,y=(e.clientY-b.top)*cv.height/b.height,v=vals();let best=-1;for(let i=0;i<v.c*v.r;i++){const q=rect(i);if(x>=q.x&&x<q.x+q.w&&y>=q.y&&y<q.y+q.h){best=i;break}}if(best>=0){index=best;draw()}});$('prev').onclick=()=>{if(!img)return;const n=rect(index).total;index=(index-1+n)%n;draw()};$('next').onclick=()=>{if(!img)return;index=(index+1)%rect(index).total;draw()};function frameCanvas(){if(!img)return null;const q=rect(index),o=document.createElement('canvas');o.width=Math.max(1,Math.round(q.w));o.height=Math.max(1,Math.round(q.h));o.getContext('2d').drawImage(img,q.x,q.y,q.w,q.h,0,0,o.width,o.height);return o}$('save').onclick=()=>{const o=frameCanvas();if(!o)return;o.toBlob(b=>{const a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download='frame-'+String(index+1).padStart(3,'0')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)},'image/png')};$('copy').onclick=async()=>{const o=frameCanvas();if(!o)return;if(!navigator.clipboard||typeof ClipboardItem==='undefined'){status.textContent='PNG clipboard is not supported by this browser.';return}o.toBlob(async b=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);status.textContent='Frame copied to clipboard.'}catch(e){status.textContent='Clipboard permission denied.'}},'image/png')};})();</script></body></html>
