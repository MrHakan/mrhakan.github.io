<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#008080"><meta name="description" content="Format, validate, sort, inspect, query and export JSON entirely in the browser.">

<title>JSON Lab 98</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#008080;font-family:"MS Sans Serif",Tahoma,Arial,sans-serif}body{padding:10px}.win{max-width:1100px;margin:auto;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:5px 5px #004d4d}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:4px 6px;display:flex}.title a{margin-left:auto;background:#c0c0c0;color:#000;text-decoration:none;border:2px solid;border-color:#fff #000 #000 #fff;padding:0 6px}.toolbar{display:flex;gap:5px;flex-wrap:wrap;padding:7px}.btn{background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;padding:6px 9px;font-weight:bold;font-size:12px;cursor:pointer}.btn:active{border-color:#000 #fff #fff #000}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px 8px}.pane{min-width:0}.pane h2{font-size:12px;margin:0 0 4px}.editor,.tree{width:100%;height:480px;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:8px;font:13px/1.45 Consolas,"Courier New",monospace;resize:vertical;overflow:auto;white-space:pre}.tree{white-space:normal}.node{margin-left:14px}.key{color:#000080;font-weight:bold}.str{color:#008000}.num{color:#800080}.bool{color:#b00000}.null{color:#808080}.status{margin:0 8px 8px;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:7px;font:12px monospace}.query{display:flex;gap:5px;padding:0 8px 8px}.query input{flex:1;min-width:0;border:2px solid;border-color:#808080 #fff #fff #808080;padding:6px;font:12px monospace}.note{padding:0 10px 10px;font-size:11px;color:#333}@media(max-width:760px){body{padding:4px}.grid{grid-template-columns:1fr}.editor,.tree{height:330px}.btn{min-height:38px}.query{flex-wrap:wrap}.query input{flex-basis:100%}}

:focus-visible{outline:2px solid #000080;outline-offset:2px}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0ms!important}
}
</style></head><body><main class="win"><div class="title">🧪 JSON LAB 98.EXE <a href="../../" aria-label="Back">×</a></div><div class="toolbar"><button class="btn" id="format">FORMAT</button><button class="btn" id="minify">MINIFY</button><button class="btn" id="validate">VALIDATE</button><button class="btn" id="sort">SORT KEYS</button><button class="btn" id="copy">COPY</button><button class="btn" id="save">SAVE .JSON</button><button class="btn" id="open">OPEN FILE</button><button class="btn" id="clear">CLEAR</button><input id="file" type="file" accept="application/json,.json,text/plain" hidden></div><div class="query"><input id="path" placeholder="Path: user.profile.name or items[0].id"><button class="btn" id="run">GET PATH</button></div><div class="grid"><section class="pane"><h2>JSON SOURCE</h2><textarea class="editor" id="src" spellcheck="false">{
  "site": "mrhakan.github.io",
  "mode": "local-first",
  "features": ["format", "tree", "path query"]
}</textarea></section><section class="pane"><h2>STRUCTURE / RESULT</h2><div class="tree" id="tree"></div></section></div><div class="status" id="status">Ready. Everything stays in this browser tab.</div><div class="note">Drag a .json file onto the editor or use OPEN FILE. No uploads, analytics, APIs, or backend calls.</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),src=$('src'),tree=$('tree'),status=$('status'),file=$('file');let timer;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function parse(){return JSON.parse(src.value)}function stats(v){let nodes=0,depth=0;function walk(x,d){nodes++;depth=Math.max(depth,d);if(x&&typeof x==='object')Object.values(x).forEach(y=>walk(y,d+1))}walk(v,1);return{nodes,depth}}function render(v){function r(x){if(x===null)return'<span class="null">null</span>';if(typeof x==='string')return'<span class="str">"'+esc(x)+'"</span>';if(typeof x==='number')return'<span class="num">'+x+'</span>';if(typeof x==='boolean')return'<span class="bool">'+x+'</span>';if(Array.isArray(x))return'<details open><summary>Array('+x.length+')</summary><div class="node">'+x.map((v,i)=>'<div><span class="key">['+i+']</span>: '+r(v)+'</div>').join('')+'</div></details>';if(typeof x==='object'){const es=Object.entries(x);return'<details open><summary>Object {'+es.length+'}</summary><div class="node">'+es.map(([k,v])=>'<div><span class="key">'+esc(k)+'</span>: '+r(v)+'</div>').join('')+'</div></details>'}return esc(x)}tree.innerHTML=r(v);const s=stats(v);status.textContent='Valid JSON · '+s.nodes+' value(s) · max depth '+s.depth+' · '+new Blob([src.value]).size+' bytes'}function refresh(){try{render(parse())}catch(e){tree.innerHTML='<span class="bool">Invalid JSON</span>';status.textContent='ERROR: '+e.message}}function sortDeep(v){if(Array.isArray(v))return v.map(sortDeep);if(v&&typeof v==='object')return Object.keys(v).sort((a,b)=>a.localeCompare(b)).reduce((o,k)=>(o[k]=sortDeep(v[k]),o),{});return v}function pathTokens(p){const out=[];p.replace(/\[(\d+)\]|\.?(\w+)/g,(_,i,k)=>{out.push(i!==undefined?+i:k)});return out}function getPath(v,p){let cur=v;for(const k of pathTokens(p)){if(cur==null||!(k in Object(cur)))throw Error('Path not found at '+k);cur=cur[k]}return cur}$('format').onclick=()=>{try{src.value=JSON.stringify(parse(),null,2);refresh()}catch(e){refresh()}};$('minify').onclick=()=>{try{src.value=JSON.stringify(parse());refresh()}catch(e){refresh()}};$('validate').onclick=refresh;$('sort').onclick=()=>{try{src.value=JSON.stringify(sortDeep(parse()),null,2);refresh()}catch(e){refresh()}};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(src.value);status.textContent='Copied JSON to clipboard.'}catch(e){src.select();document.execCommand('copy');status.textContent='Copied JSON.'}};$('save').onclick=()=>{try{parse();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([src.value],{type:'application/json'}));a.download='data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){refresh()}};$('clear').onclick=()=>{src.value='';tree.innerHTML='';status.textContent='Cleared.'};$('open').onclick=()=>file.click();file.onchange=()=>{const f=file.files[0];if(f)f.text().then(t=>{src.value=t;refresh()});file.value=''};$('run').onclick=()=>{try{const v=getPath(parse(),$('path').value.trim());tree.innerHTML='<div><b>Path result:</b></div><pre>'+esc(typeof v==='string'?v:JSON.stringify(v,null,2))+'</pre>';status.textContent='Path resolved successfully.'}catch(e){status.textContent='ERROR: '+e.message}};src.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(refresh,300)});['dragover','drop'].forEach(ev=>src.addEventListener(ev,e=>{e.preventDefault();if(ev==='drop'&&e.dataTransfer.files[0])e.dataTransfer.files[0].text().then(t=>{src.value=t;refresh()})}));refresh()})();
</script></body></html>
