<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#008080">
<meta name="description" content="Dither local images with retro palettes, pixel sizing and multiple algorithms.">
<link rel="canonical" href="https://mrhakan.github.io/apps/pixel-dither-lab/">
<meta property="og:type" content="website">
<meta property="og:title" content="Pixel Dither Lab">
<meta property="og:description" content="Dither local images with retro palettes, pixel sizing and multiple algorithms.">
<meta property="og:url" content="https://mrhakan.github.io/apps/pixel-dither-lab/">
<title>Pixel Dither Lab</title>
<style>
:root{font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080;color:#000}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#008080}body{padding:16px}.window{max-width:1050px;margin:auto;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:2px 2px 0 #000}.titlebar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:700;padding:3px 4px;font-size:14px}.titlebar a{color:#000;text-decoration:none;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;padding:0 5px;line-height:17px}.content{display:grid;grid-template-columns:280px minmax(0,1fr);gap:10px;padding:10px}.controls,.preview{background:#c0c0c0}.group{border:2px solid;border-color:#808080 #fff #fff #808080;padding:8px;margin-bottom:8px}.group h2{font-size:12px;margin:0 0 7px;font-weight:700}.row{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:7px;margin:7px 0;font-size:12px}.row input[type=range]{width:100%}.row select,.row input[type=number]{width:100%;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:4px;font:12px inherit}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.btn{appearance:none;background:#c0c0c0;color:#000;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:1px 1px 0 #000;padding:7px 8px;font:700 12px inherit;cursor:pointer}.btn:active{border-color:#000 #fff #fff #000;transform:translate(1px,1px);box-shadow:none}.drop{display:grid;place-items:center;min-height:110px;text-align:center;background:#fff;border:2px dashed #808080;padding:12px;font-size:12px;line-height:1.45;cursor:pointer}.drop.drag{background:#ffffcc}.preview{min-width:0}.canvasWrap{background:#333;border:2px solid;border-color:#808080 #fff #fff #808080;min-height:420px;display:grid;place-items:center;padding:10px;overflow:auto;background-image:linear-gradient(45deg,#444 25%,transparent 25%),linear-gradient(-45deg,#444 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#444 75%),linear-gradient(-45deg,transparent 75%,#444 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}canvas{max-width:100%;height:auto;image-rendering:pixelated;box-shadow:0 0 0 1px #000}.status{margin-top:7px;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:6px;font-size:12px;min-height:29px}.privacy{font-size:11px;line-height:1.4;margin:8px 0 0}.value{font-family:monospace;font-weight:700}@media(max-width:760px){body{padding:7px}.content{grid-template-columns:1fr;padding:7px}.canvasWrap{min-height:260px}.buttons{grid-template-columns:1fr 1fr}.controls{order:2}.preview{order:1}}

:focus-visible{outline:2px solid #000080;outline-offset:2px}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0ms!important}
}
</style>
</head>
<body>
<main class="window">
  <div class="titlebar"><span>🎨 PIXEL DITHER LAB.EXE</span><a href="../../">×</a></div>
  <div class="content">
    <section class="controls">
      <div class="group">
        <h2>IMAGE SOURCE</h2>
        <label class="drop" id="drop">Drop an image here<br>or click to choose<br><small>PNG · JPG · WEBP · GIF first frame</small><input id="file" type="file" accept="image/*" hidden></label>
      </div>
      <div class="group">
        <h2>PROCESSING</h2>
        <label class="row"><span>Palette</span><select id="palette"><option value="mono">1-bit B/W</option><option value="gameboy">Game Boy</option><option value="cga">CGA</option><option value="amber">Amber CRT</option><option value="rgb8">8-color RGB</option></select></label>
        <label class="row"><span>Dither</span><select id="mode"><option value="floyd">Floyd-Steinberg</option><option value="bayer">Bayer 4×4</option><option value="nearest">Nearest color</option></select></label>
        <label class="row"><span>Pixel size</span><span><input id="pixel" type="range" min="1" max="16" value="4"><span class="value" id="pixelV">4</span></span></label>
        <label class="row"><span>Brightness</span><span><input id="brightness" type="range" min="-80" max="80" value="0"><span class="value" id="brightnessV">0</span></span></label>
        <label class="row"><span>Contrast</span><span><input id="contrast" type="range" min="-80" max="80" value="10"><span class="value" id="contrastV">10</span></span></label>
        <label class="row"><span>Dither amt.</span><span><input id="strength" type="range" min="0" max="100" value="72"><span class="value" id="strengthV">72%</span></span></label>
      </div>
      <div class="buttons">
        <button class="btn" id="demo">LOAD DEMO</button>
        <button class="btn" id="random">RANDOMIZE</button>
        <button class="btn" id="reset">RESET FX</button>
        <button class="btn" id="save">SAVE PNG</button>
      </div>
      <p class="privacy">Everything runs locally in your browser. Images are never uploaded anywhere.</p>
    </section>
    <section class="preview">
      <div class="canvasWrap"><canvas id="out" width="640" height="420"></canvas></div>
      <div class="status" id="status">No upload required — a generated demo scene is ready.</div>
    </section>
  </div>
</main>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id),out=$('out'),octx=out.getContext('2d'),src=document.createElement('canvas'),sctx=src.getContext('2d',{willReadFrequently:true});
const work=document.createElement('canvas'),wctx=work.getContext('2d',{willReadFrequently:true});
const status=$('status'),drop=$('drop'),file=$('file');
const palettes={
 mono:[[0,0,0],[255,255,255]],
 gameboy:[[15,56,15],[48,98,48],[139,172,15],[155,188,15]],
 cga:[[0,0,0],[0,170,170],[170,0,170],[170,170,170],[85,85,85],[85,255,255],[255,85,255],[255,255,255]],
 amber:[[7,4,0],[64,35,0],[165,92,0],[255,191,64],[255,235,177]],
 rgb8:[[0,0,0],[255,0,0],[0,255,0],[0,0,255],[255,255,0],[0,255,255],[255,0,255],[255,255,255]]
};
const controls=['palette','mode','pixel','brightness','contrast','strength'];
function clamp(v){return v<0?0:v>255?255:v}
function nearest(r,g,b,pal){let best=pal[0],bd=Infinity;for(const c of pal){const dr=r-c[0],dg=g-c[1],db=b-c[2],d=dr*dr+dg*dg+db*db;if(d<bd){bd=d;best=c}}return best}
function adjusted(v,brightness,contrast){const c=(100+contrast)/100;return clamp((v-128)*c+128+brightness)}
function render(){if(!src.width||!src.height)return;const px=+$('pixel').value,bri=+$('brightness').value,con=+$('contrast').value,str=+$('strength').value/100,mode=$('mode').value,pal=palettes[$('palette').value];
 const maxW=900,maxH=620,scale=Math.min(1,maxW/src.width,maxH/src.height),dw=Math.max(1,Math.round(src.width*scale)),dh=Math.max(1,Math.round(src.height*scale));out.width=dw;out.height=dh;
 const ww=Math.max(1,Math.round(dw/px)),wh=Math.max(1,Math.round(dh/px));work.width=ww;work.height=wh;wctx.imageSmoothingEnabled=true;wctx.drawImage(src,0,0,ww,wh);const img=wctx.getImageData(0,0,ww,wh),d=img.data;
 for(let i=0;i<d.length;i+=4){d[i]=adjusted(d[i],bri,con);d[i+1]=adjusted(d[i+1],bri,con);d[i+2]=adjusted(d[i+2],bri,con)}
 if(mode==='floyd')floyd(d,ww,wh,pal,str);else if(mode==='bayer')bayer(d,ww,wh,pal,str);else mapNearest(d,pal);
 wctx.putImageData(img,0,0);octx.imageSmoothingEnabled=false;octx.clearRect(0,0,dw,dh);octx.drawImage(work,0,0,ww,wh,0,0,dw,dh);status.textContent=`${dw}×${dh} preview · ${ww}×${wh} processed pixels · ${$('palette').selectedOptions[0].textContent}`;
}
function mapNearest(d,pal){for(let i=0;i<d.length;i+=4){const c=nearest(d[i],d[i+1],d[i+2],pal);d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2]}}
function bayer(d,w,h,pal,str){const m=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4,off=((m[y&3][x&3]-7.5)/7.5)*54*str,c=nearest(clamp(d[i]+off),clamp(d[i+1]+off),clamp(d[i+2]+off),pal);d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2]}}
function floyd(d,w,h,pal,str){const vals=new Float32Array(w*h*3);for(let p=0,j=0;p<d.length;p+=4,j+=3){vals[j]=d[p];vals[j+1]=d[p+1];vals[j+2]=d[p+2]}
 const add=(x,y,er,eg,eb,f)=>{if(x<0||x>=w||y<0||y>=h)return;const j=(y*w+x)*3;vals[j]+=er*f*str;vals[j+1]+=eg*f*str;vals[j+2]+=eb*f*str};
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const j=(y*w+x)*3,i=(y*w+x)*4,old=[clamp(vals[j]),clamp(vals[j+1]),clamp(vals[j+2])],c=nearest(old[0],old[1],old[2],pal),er=old[0]-c[0],eg=old[1]-c[1],eb=old[2]-c[2];d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];add(x+1,y,er,eg,eb,7/16);add(x-1,y+1,er,eg,eb,3/16);add(x,y+1,er,eg,eb,5/16);add(x+1,y+1,er,eg,eb,1/16)}}
function demo(){src.width=720;src.height=460;const g=sctx.createLinearGradient(0,0,720,460);g.addColorStop(0,'#071a44');g.addColorStop(.45,'#e14b87');g.addColorStop(1,'#ffc65a');sctx.fillStyle=g;sctx.fillRect(0,0,720,460);sctx.fillStyle='rgba(255,255,255,.85)';sctx.beginPath();sctx.arc(550,105,63,0,Math.PI*2);sctx.fill();sctx.fillStyle='#15133d';sctx.beginPath();sctx.moveTo(0,350);for(let x=0;x<=720;x+=30){const y=335+Math.sin(x*.023)*24+Math.sin(x*.071)*11;sctx.lineTo(x,y)}sctx.lineTo(720,460);sctx.lineTo(0,460);sctx.closePath();sctx.fill();sctx.strokeStyle='rgba(255,255,255,.3)';for(let i=0;i<18;i++){sctx.beginPath();sctx.moveTo(0,370+i*8);sctx.lineTo(720,370+i*8);sctx.stroke()}sctx.fillStyle='#fff';sctx.font='bold 58px monospace';sctx.fillText('DITHER',34,88);sctx.font='22px monospace';sctx.fillText('LOCAL // NO UPLOAD',38,118);render()}
function loadBlob(blob){if(!blob||!blob.type.startsWith('image/')){status.textContent='That file is not an image.';return}const url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/img.width,max/img.height);src.width=Math.max(1,Math.round(img.width*scale));src.height=Math.max(1,Math.round(img.height*scale));sctx.clearRect(0,0,src.width,src.height);sctx.drawImage(img,0,0,src.width,src.height);URL.revokeObjectURL(url);render()};img.onerror=()=>{URL.revokeObjectURL(url);status.textContent='Could not decode this image.'};img.src=url}
function updateLabels(){$('pixelV').textContent=$('pixel').value;$('brightnessV').textContent=$('brightness').value;$('contrastV').textContent=$('contrast').value;$('strengthV').textContent=$('strength').value+'%'}
controls.forEach(id=>$(id).addEventListener('input',()=>{updateLabels();render()}));
drop.addEventListener('click',()=>file.click());file.addEventListener('change',()=>{if(file.files[0])loadBlob(file.files[0])});['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>loadBlob(e.dataTransfer.files[0]));
window.addEventListener('paste',e=>{const item=[...e.clipboardData.items].find(i=>i.type.startsWith('image/'));if(item){loadBlob(item.getAsFile());status.textContent='Pasted image loaded.'}});
$('demo').onclick=demo;$('reset').onclick=()=>{$('palette').value='mono';$('mode').value='floyd';$('pixel').value=4;$('brightness').value=0;$('contrast').value=10;$('strength').value=72;updateLabels();render()};
$('random').onclick=()=>{const ps=Object.keys(palettes),ms=['floyd','bayer','nearest'];$('palette').value=ps[Math.floor(Math.random()*ps.length)];$('mode').value=ms[Math.floor(Math.random()*ms.length)];$('pixel').value=1+Math.floor(Math.random()*10);$('brightness').value=-25+Math.floor(Math.random()*51);$('contrast').value=Math.floor(Math.random()*51);$('strength').value=35+Math.floor(Math.random()*66);updateLabels();render()};
$('save').onclick=()=>{out.toBlob(blob=>{if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`pixel-dither-${Date.now()}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status.textContent='PNG exported.'},'image/png')};
updateLabels();demo();
})();
</script>
</body>
</html>
