<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#008080"><title>ASCII Lab 98</title><style>:root{font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#008080}body{padding:8px}.win{max-width:1100px;margin:auto;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:5px 5px #004040}.title{display:flex;background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:4px 6px}.title a{margin-left:auto;color:#000;text-decoration:none;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;padding:0 5px}.body{display:grid;grid-template-columns:280px 1fr;gap:8px;padding:8px}.group{border:2px solid;border-color:#808080 #fff #fff #808080;padding:8px;margin-bottom:8px}.group h2{font-size:12px;margin:0 0 8px}.row{display:grid;grid-template-columns:90px 1fr;gap:6px;align-items:center;font-size:11px;margin:7px 0}input,select,button{font:12px "MS Sans Serif",sans-serif}input[type=range]{width:100%}button,.file{background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;padding:6px;cursor:pointer;font-weight:bold}.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}.drop{display:block;text-align:center;padding:13px}.preview{min-width:0;background:#000;border:2px solid;border-color:#808080 #fff #fff #808080;overflow:auto;min-height:570px}.preview pre{margin:0;padding:12px;color:#0f0;background:#000;font:8px/1 monospace;white-space:pre;letter-spacing:0}.status{font:11px monospace;margin-top:7px}.note{font-size:10px;line-height:1.4}@media(max-width:760px){body{padding:4px}.body{grid-template-columns:1fr}.preview{min-height:360px}.preview pre{font-size:5px}.actions button{min-height:38px}}</style></head><body><main class="win"><div class="title">⌨ ASCII LAB 98.EXE <a href="../../">×</a></div><div class="body"><section><div class="group"><h2>IMAGE</h2><label class="file drop">OPEN IMAGE<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label><div class="note">PNG, JPG, WebP or GIF first frame. Processing stays in this tab.</div></div><div class="group"><h2>CONVERSION</h2><label class="row"><span>Columns</span><input id="cols" type="range" min="24" max="180" value="90"></label><label class="row"><span>Ramp</span><select id="ramp"><option value="@%#*+=-:. ">Classic</option><option value="█▓▒░ ">Blocks</option><option value="MWNXK0Okxdolc:,. ">Detailed</option><option value="#*:. ">Minimal</option></select></label><label class="row"><span>Brightness</span><input id="bright" type="range" min="-80" max="80" value="0"></label><label class="row"><span>Contrast</span><input id="contrast" type="range" min="-80" max="80" value="10"></label><label class="row"><span>Gamma</span><input id="gamma" type="range" min="50" max="180" value="100"></label><label><input id="invert" type="checkbox"> Invert luminance</label></div><div class="group"><h2>DISPLAY</h2><label class="row"><span>Phosphor</span><select id="theme"><option value="#00ff66">Green</option><option value="#ffb000">Amber</option><option value="#e8e8e8">Mono</option><option value="#66ccff">Cyan</option></select></label><div class="actions"><button id="copy">COPY TEXT</button><button id="txt">SAVE TXT</button><button id="png">SAVE PNG</button><button id="reset">RESET</button></div><div class="status" id="status">Open an image to begin.</div></div></section><section class="preview"><pre id="out">ASCII LAB 98

No image loaded.

[ open image ]</pre></section></div></main><canvas id="work" hidden></canvas><script>(()=>{'use strict';const $=id=>document.getElementById(id),f=$('file'),out=$('out'),cv=$('work'),ctx=cv.getContext('2d');let img=null,text='';function render(){if(!img)return;const cols=+$('cols').value,aspect=.52,rows=Math.max(1,Math.round(img.height/img.width*cols*aspect));cv.width=cols;cv.height=rows;ctx.drawImage(img,0,0,cols,rows);const d=ctx.getImageData(0,0,cols,rows).data,ramp=$('ramp').value,b=+$('bright').value,c=+$('contrast').value,g=+$('gamma').value/100,inv=$('invert').checked;let s='';for(let y=0;y<rows;y++){for(let x=0;x<cols;x++){const i=(y*cols+x)*4;if(d[i+3]<20){s+=' ';continue}let lum=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];lum+=b;const cf=(259*(c+255))/(255*(259-c));lum=cf*(lum-128)+128;lum=255*Math.pow(Math.max(0,Math.min(255,lum))/255,1/g);if(inv)lum=255-lum;const ri=Math.round((255-lum)/255*(ramp.length-1));s+=ramp[Math.max(0,Math.min(ramp.length-1,ri))]}s+='\n'}text=s;out.textContent=s;out.style.color=$('theme').value;$('status').textContent=cols+'×'+rows+' characters · '+(cols*rows).toLocaleString()+' cells'}function load(file){if(!file)return;const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{img=im;URL.revokeObjectURL(u);render()};im.src=u}f.onchange=()=>load(f.files[0]);document.querySelectorAll('input[type=range],select,input[type=checkbox]').forEach(e=>e.oninput=render);$('theme').onchange=render;$('copy').onclick=async()=>{if(!text)return;try{await navigator.clipboard.writeText(text);$('status').textContent='Copied ASCII text.'}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}};function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('txt').onclick=()=>text&&dl(new Blob([text],{type:'text/plain'}),'ascii-lab.txt');$('png').onclick=()=>{if(!text)return;const lines=text.trimEnd().split('\n'),fs=10,w=Math.max(...lines.map(l=>l.length))*6+20,h=lines.length*10+20,o=document.createElement('canvas');o.width=w;o.height=h;const q=o.getContext('2d');q.fillStyle='#000';q.fillRect(0,0,w,h);q.fillStyle=$('theme').value;q.font=fs+'px monospace';q.textBaseline='top';lines.forEach((l,i)=>q.fillText(l,10,10+i*10));o.toBlob(b=>dl(b,'ascii-lab.png'))};$('reset').onclick=()=>{$('cols').value=90;$('bright').value=0;$('contrast').value=10;$('gamma').value=100;$('invert').checked=false;$('ramp').selectedIndex=0;$('theme').selectedIndex=0;render()};document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();load(e.dataTransfer.files[0])});})();</script></body></html>
