<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><title>Regex Lab 98</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#008080;font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;color:#000}body{padding:10px}.win{max-width:980px;margin:auto;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:5px 5px #004d4d}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:4px 6px;display:flex}.title a{margin-left:auto;background:#c0c0c0;color:#000;text-decoration:none;border:2px solid;border-color:#fff #000 #000 #fff;padding:0 6px}.pad{padding:8px}.row{display:grid;grid-template-columns:1fr 120px;gap:6px}.field,textarea{width:100%;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:7px;font:13px/1.4 Consolas,monospace;color:#000}textarea{min-height:190px;resize:vertical}.label{font-size:12px;font-weight:bold;margin:8px 0 3px}.buttons{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.btn{background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;padding:6px 10px;font-weight:bold;cursor:pointer}.btn:active{border-color:#000 #fff #fff #000}.status,.panel{background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:7px;font:12px/1.45 Consolas,monospace}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.match{padding:4px;border-bottom:1px dotted #aaa}.match b{background:#ffff00}.ok{color:#087b08}.bad{color:#b00000}.hint{font-size:11px;color:#333;margin-top:6px}@media(max-width:650px){body{padding:4px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 90px}}</style></head><body><main class="win"><div class="title">🧬 REGEX LAB 98.EXE <a href="../../">×</a></div><div class="pad"><div class="label">PATTERN</div><div class="row"><input class="field" id="pattern" value="\\b([A-Za-z]+)@([A-Za-z]+\\.[A-Za-z]{2,})\\b" spellcheck="false"><input class="field" id="flags" value="gi" aria-label="flags"></div><div class="buttons"><button class="btn" id="run">RUN [CTRL+ENTER]</button><button class="btn" id="copy">COPY REGEX</button><button class="btn" id="clear">CLEAR</button><select class="btn" id="preset"><option value="">presets...</option><option value="email">email</option><option value="url">URL</option><option value="ipv4">IPv4</option><option value="hex">hex color</option><option value="date">YYYY-MM-DD</option><option value="words">words</option></select></div><div id="status" class="status">Ready.</div><div class="grid"><section><div class="label">TEST TEXT</div><textarea id="text" spellcheck="false">Contact alice@example.com or bob@test.org.\nShip date: 2026-09-23\nColor: #008080</textarea></section><section><div class="label">REPLACEMENT (optional)</div><textarea id="replacement" spellcheck="false" placeholder="Use $1, $2, $&, etc."></textarea></section></div><div class="grid"><section><div class="label">MATCHES</div><div id="matches" class="panel">Run a pattern to inspect matches and capture groups.</div></section><section><div class="label">REPLACED OUTPUT</div><div id="output" class="panel" style="white-space:pre-wrap;min-height:80px">Replacement preview appears here.</div></section></div><div class="hint">Everything runs locally with JavaScript RegExp. No text is uploaded or stored. Zero-width matches are handled safely.</div></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const presets={email:['\\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}\\b','gi'],url:['https?:\\/\\/[^\\s<]+','gi'],ipv4:['\\b(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)(?:\\.(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)){3}\\b','g'],hex:['#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})\\b','g'],date:['\\b\\d{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12]\\d|3[01])\\b','g'],words:['\\b[\\p{L}\\p{N}_]+\\b','gu']};function run(){const p=$('pattern').value,f=$('flags').value.replace(/[^dgimsuvy]/g,''),text=$('text').value;let re;try{re=new RegExp(p,f);$('status').className='status ok'}catch(e){$('status').className='status bad';$('status').textContent='ERROR: '+e.message;$('matches').textContent='Invalid expression.';return}const flags=re.flags.includes('g')?re.flags:re.flags+'g';let scan;try{scan=new RegExp(re.source,flags)}catch(e){scan=re}const found=[];let m;while((m=scan.exec(text))&&found.length<500){found.push(m);if(m[0]==='')scan.lastIndex++}const named=found.reduce((n,x)=>n+(x.groups?Object.keys(x.groups).length:0),0);$('status').textContent='VALID · '+found.length+' match'+(found.length===1?'':'es')+' · flags /'+re.flags+' · '+named+' named capture'+(named===1?'':'s');$('matches').innerHTML=found.length?found.map((x,i)=>'<div class="match"><b>#'+(i+1)+'</b> @'+x.index+' → <code>'+esc(x[0]||'(zero-width)')+'</code>'+(x.length>1?'<br>groups: '+x.slice(1).map((v,j)=>'$'+(j+1)+'='+esc(v)).join(' · '):'')+(x.groups?'<br>named: '+Object.entries(x.groups).map(([k,v])=>esc(k)+'='+esc(v)).join(' · '):'')+'</div>').join(''):'No matches.';const rep=$('replacement').value;try{$('output').textContent=rep?text.replace(re,rep):'Enter a replacement string to preview replace().'}catch(e){$('output').textContent='Replacement error: '+e.message}}$('run').onclick=run;$('copy').onclick=async()=>{const s='/'+$('pattern').value+'/'+$('flags').value;try{await navigator.clipboard.writeText(s);$('status').textContent='Copied '+s}catch(e){$('status').textContent='Clipboard unavailable.'}};$('clear').onclick=()=>{$('pattern').value='';$('text').value='';$('replacement').value='';run()};$('preset').onchange=e=>{if(presets[e.target.value]){[$('pattern').value,$('flags').value]=presets[e.target.value];run()}};['pattern','flags','text','replacement'].forEach(id=>$(id).addEventListener('input',run));addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();run()}});run()})();</script></body></html>
