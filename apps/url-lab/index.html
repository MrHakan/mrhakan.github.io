<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6b6b8e"><title>URL Lab 98</title><meta name="description" content="Parse, edit, encode and rebuild URLs entirely in your browser."><link rel="canonical" href="https://mrhakan.github.io/apps/url-lab/"><meta property="og:title" content="URL Lab 98"><meta property="og:description" content="Parse and rebuild URLs locally with editable query parameters and encoding helpers."><meta property="og:type" content="website"><meta property="og:url" content="https://mrhakan.github.io/apps/url-lab/"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:14px;background:#6b6b8e;font:13px Tahoma,Arial,sans-serif}.win{max-width:900px;margin:auto;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:7px 7px #34344c;padding:3px}.title{background:linear-gradient(90deg,#000080,#1084d0);color:white;font-weight:bold;padding:7px;display:flex;justify-content:space-between}.title a{color:#000;background:#c0c0c0;text-decoration:none;padding:0 6px;border:2px outset #eee}.body{padding:10px}label{font-weight:bold;display:block;margin:8px 0 3px}input,textarea{width:100%;padding:7px;border:2px inset #ddd;font:13px "Courier New",monospace}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.params{margin:10px 0;border:2px inset #ddd;background:#fff;padding:6px}.param{display:grid;grid-template-columns:1fr 1fr auto;gap:5px;margin:5px}.btn{border:2px solid;border-color:#fff #404040 #404040 #fff;background:#c0c0c0;padding:7px 10px;font-weight:bold}.status{background:#ffffe1;border:1px solid #808080;padding:7px;margin-top:9px}/* Playground focus visibility */:where(a,button,input,select,textarea,[tabindex]):focus-visible{outline:2px solid #f0f;outline-offset:2px}@media(max-width:600px){.grid{grid-template-columns:1fr}.param{grid-template-columns:1fr 1fr}.param .btn{grid-column:1/-1}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}</style></head><body><main class="win"><div class="title"><span>🔗 URL LAB 98.EXE</span><a href="../../" aria-label="Back to Playground">×</a></div><div class="body"><label for="src">URL</label><input id="src" value="https://example.com/docs/page?mode=dark&tab=2#intro"><p><button type="button" class="btn" id="parse">PARSE</button> <button type="button" class="btn" id="copy">COPY URL</button> <button type="button" class="btn" id="add">ADD PARAM</button></p><div class="grid"><div><label for="protocol">Protocol</label><input id="protocol"><label for="host">Host</label><input id="host"><label for="port">Port</label><input id="port"></div><div><label for="path">Path</label><input id="path"><label for="hash">Hash</label><input id="hash"><label for="result">Rebuilt URL</label><textarea id="result" rows="3" readonly></textarea></div></div><label>Query parameters</label><div class="params" id="params"></div><p><button type="button" class="btn" id="enc">ENCODE TEXT</button> <button type="button" class="btn" id="dec">DECODE TEXT</button></p><label for="codec">Encoding scratchpad</label><textarea id="codec" rows="3" placeholder="Paste text or percent-encoded text..."></textarea><div class="status" id="status" role="status" aria-live="polite">Everything stays in this tab.</div></div></main><script>(()=>{'use strict';const $=x=>document.getElementById(x),fields=['protocol','host','port','path','hash'];function row(k='',v=''){const d=document.createElement('div');d.className='param';d.innerHTML='<input aria-label="Parameter name" value="'+esc(k)+'"><input aria-label="Parameter value" value="'+esc(v)+'"><button type="button" class="btn" aria-label="Remove parameter">REMOVE</button>';d.querySelector('button').onclick=()=>{d.remove();build()};d.querySelectorAll('input').forEach(x=>x.oninput=build);$('params').appendChild(d)}function esc(s){return String(s).replace(/[&"]/g,c=>c==='&'?'&amp;':'&quot;')}function parse(){try{const u=new URL($('src').value);$('protocol').value=u.protocol;$('host').value=u.hostname;$('port').value=u.port;$('path').value=u.pathname;$('hash').value=u.hash;$('params').innerHTML='';u.searchParams.forEach((v,k)=>row(k,v));build();$('status').textContent='URL parsed successfully.'}catch{$('status').textContent='That is not a valid absolute URL.'}}function build(){try{let base=$('protocol').value||'https:';if(!base.endsWith(':'))base+=':';let u=new URL(base+'//'+$('host').value+($('port').value?':'+$('port').value:'')+($('path').value||'/'));document.querySelectorAll('.param').forEach(d=>{const i=d.querySelectorAll('input');if(i[0].value)u.searchParams.append(i[0].value,i[1].value)});u.hash=$('hash').value;$('result').value=u.href;$('src').value=u.href}catch{}}fields.forEach(id=>$(id).oninput=build);$('parse').onclick=parse;$('add').onclick=()=>{row();build()};$('copy').onclick=async()=>{build();try{await navigator.clipboard.writeText($('result').value);$('status').textContent='URL copied.'}catch{$('status').textContent='Clipboard unavailable.'}};$('enc').onclick=()=>{$('codec').value=encodeURIComponent($('codec').value)};$('dec').onclick=()=>{try{$('codec').value=decodeURIComponent($('codec').value)}catch{$('status').textContent='Invalid percent encoding.'}};parse()})();</script></body></html>
