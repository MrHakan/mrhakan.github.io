<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><title>Favicon Foundry 98</title><meta name="description" content="Make favicon icons locally from initials or a picture."><link rel="canonical" href="https://mrhakan.github.io/apps/favicon-foundry/"><meta property="og:title" content="Favicon Foundry 98"><meta property="og:description" content="Browser-only favicon maker with PNG and ICO exports."><link rel="stylesheet" href="style.css"><style>:where(a,button,input,select):focus-visible{outline:3px solid #f0f;outline-offset:2px}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head>
<body><main class="win"><header class="title"><h1>🎨 FAVICON FOUNDRY 98.EXE</h1><a href="../../" aria-label="Back to Playground">×</a></header><div class="body"><div class="layout">
<section class="panel"><h2>DESIGN</h2>
<label class="field">SOURCE<select id="mode"><option value="text">Initials</option><option value="image">Local picture</option></select></label>
<label class="field" id="textfield">TEXT<input id="letters" type="text" maxlength="3" value="MH"></label>
<label class="field" id="filefield" hidden>IMAGE<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label>
<label class="field">FOREGROUND<input id="fg" type="color" value="#ffffff"></label>
<label class="field">BACKGROUND<input id="bg" type="color" value="#000080"></label>
<label class="field">ROUNDING <output id="roundValue">24%</output><input id="round" type="range" min="0" max="50" value="24"></label>
<label class="field">PADDING <output id="padValue">12%</output><input id="pad" type="range" min="0" max="35" value="12"></label><p class="hint">Private, local rendering. No uploads.</p></section>
<section class="panel"><h2>PREVIEW + EXPORT</h2><div class="grid"><div class="preview"><canvas id="p16" width="16" height="16" aria-label="16 pixel preview"></canvas>16px</div><div class="preview"><canvas id="p32" width="32" height="32" aria-label="32 pixel preview"></canvas>32px</div><div class="preview"><canvas id="p180" width="180" height="180" aria-label="180 pixel preview"></canvas>180px</div><div class="preview"><canvas id="p192" width="192" height="192" aria-label="192 pixel preview"></canvas>192px</div></div>
<div class="actions"><button type="button" id="ico">SAVE ICO</button><button type="button" id="png">SAVE PNG</button><button type="button" id="copy">COPY HTML</button><button type="button" id="manifest">MANIFEST</button></div>
<label class="field">PNG SIZE<select id="size"><option>16</option><option>32</option><option>48</option><option selected>180</option><option>192</option><option>512</option></select></label><code id="snippet"></code></section></div>
<div id="status" aria-live="polite">Ready.</div></div></main><script src="render.js" defer></script><script src="app.js" defer></script></body></html>
