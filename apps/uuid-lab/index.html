<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><title>UUID Lab 98</title><meta name="description" content="Generate, inspect and validate UUIDs locally in your browser."><link rel="canonical" href="https://mrhakan.github.io/apps/uuid-lab/"><meta property="og:title" content="UUID Lab 98"><meta property="og:description" content="Generate and inspect UUIDs without sending data anywhere."><meta property="og:type" content="website"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080}body{min-height:100vh;display:grid;place-items:center;padding:10px}.win{width:min(760px,100%);background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:7px 7px #004040;padding:3px}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:6px;display:flex;justify-content:space-between}.title a{color:#000;background:#c0c0c0;text-decoration:none;padding:0 6px;border:2px solid;border-color:#fff #444 #444 #fff}.body{padding:10px}.row{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.btn{background:#c0c0c0;border:2px solid;border-color:#fff #444 #444 #fff;padding:7px 12px;font-weight:bold}input,textarea{width:100%;font:14px monospace;padding:8px;background:#fff;border:2px inset #ddd}textarea{min-height:220px;resize:vertical}.status,.info{background:#ffffe1;border:1px solid #808080;padding:8px;font:12px monospace;margin-top:8px;white-space:pre-wrap}.info{background:#fff}.help{font-size:12px;line-height:1.4}/* Playground focus visibility */:where(a,button,input,textarea):focus-visible{outline:2px solid #f0f;outline-offset:2px}@media(max-width:480px){body{padding:4px}.body{padding:6px}.btn{flex:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.page-heading{margin:0;font:inherit}
</style>

</head><body><main class="win"><div class="title"><h1 class="page-heading">🪪 UUID LAB 98.EXE</h1><a href="../../" aria-label="Back to Playground">×</a></div><div class="body"><label for="input"><b>UUID inspector</b></label><input id="input" autocomplete="off" spellcheck="false" placeholder="xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"><div class="row"><button type="button" class="btn" id="inspect">INSPECT</button><button type="button" class="btn" id="one">NEW UUID</button><button type="button" class="btn" id="many">GENERATE 20</button><button type="button" class="btn" id="copy">COPY OUTPUT</button></div><div id="info" class="info">Paste a UUID or generate one.</div><label for="output"><b>Batch output</b></label><textarea id="output" readonly aria-label="Generated UUID output"></textarea><div id="status" class="status" aria-live="polite">Everything runs locally using crypto.randomUUID().</div><p class="help">UUID v4 generation uses the browser's cryptographic random source. The inspector checks canonical UUID syntax, version and RFC variant bits. No network requests or tracking.</p></div></main><script>(()=>{'use strict';const I=document.getElementById('input'),O=document.getElementById('output'),N=document.getElementById('info'),S=document.getElementById('status');const rx=/^[0-9a-f]{8}-[0-9a-f]{4}-([1-8])[0-9a-f]{3}-([89ab])[0-9a-f]{3}-[0-9a-f]{12}$/i;function uuid(){if(crypto.randomUUID)return crypto.randomUUID();const b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&15|64;b[8]=b[8]&63|128;const h=[...b].map(x=>x.toString(16).padStart(2,'0'));return `${h.slice(0,4).join('')}-${h.slice(4,6).join('')}-${h.slice(6,8).join('')}-${h.slice(8,10).join('')}-${h.slice(10).join('')}`}function inspect(){const s=I.value.trim(),m=s.match(rx);if(!m){N.textContent='INVALID\nNot a canonical RFC-style UUID.';S.textContent='Validation failed.';return}const variant=/^[89ab]$/i.test(m[2])?'RFC 4122 / RFC 9562':'Other';N.textContent=`VALID\nVersion: ${m[1]}\nVariant: ${variant}\nCanonical: ${s.toLowerCase()}`;S.textContent='UUID parsed locally.'}document.getElementById('inspect').onclick=inspect;document.getElementById('one').onclick=()=>{I.value=uuid();inspect()};document.getElementById('many').onclick=()=>{O.value=Array.from({length:20},uuid).join('\n');S.textContent='Generated 20 UUID v4 values.'};document.getElementById('copy').onclick=async()=>{const text=O.value||I.value;if(!text){S.textContent='Nothing to copy.';return}try{await navigator.clipboard.writeText(text);S.textContent='Copied to clipboard.'}catch{O.focus();O.select();S.textContent='Clipboard unavailable; output selected for manual copy.'}};I.addEventListener('keydown',e=>{if(e.key==='Enter')inspect()})})();</script></body></html>
