<title>Text Transform Lab 98</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#008080;font-family:"MS Sans Serif",Tahoma,Arial,sans-serif}.win{max-width:1050px;margin:10px auto;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:5px 5px #004040}.title{background:#000080;color:#fff;font-weight:bold;padding:4px 6px;display:flex}.title a{margin-left:auto;color:#000;background:#c0c0c0;text-decoration:none;padding:0 6px;border:2px solid;border-color:#fff #000 #000 #fff}.grid{display:grid;grid-template-columns:1fr 250px 1fr;gap:8px;padding:8px}textarea{width:100%;min-height:430px;resize:vertical;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:8px;font:14px/1.45 monospace}.panel{border:2px solid;border-color:#808080 #fff #fff #808080;padding:7px}.panel h2{font-size:12px;margin:0 0 7px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:5px}button,select,input{font:12px "MS Sans Serif",sans-serif}button{background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;padding:7px;cursor:pointer;font-weight:bold}button:active{border-color:#000 #fff #fff #000}.row{margin:8px 0;font-size:11px}.row select,.row input{width:100%;margin-top:3px}.status{margin:0 8px 8px;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:6px;font:11px monospace}@media(max-width:760px){.grid{grid-template-columns:1fr}.mid{order:2}.out{order:3}textarea{min-height:240px}}

</style></head><body><main class="win"><div class="title">📝 TEXT TRANSFORM LAB 98.EXE<a href="../../">×</a></div><div class="grid"><section><div class="panel"><h2>INPUT.TXT</h2><textarea id="input" placeholder="Paste or type text here..."></textarea></div></section><section class="mid"><div class="panel"><h2>TRANSFORMS</h2><div class="buttons"><button data-a="upper">UPPER</button><button data-a="lower">lower</button><button data-a="title">Title Case</button><button data-a="sentence">Sentence</button><button data-a="reverse">Reverse</button><button data-a="lines">Reverse Lines</button><button data-a="sort">Sort Lines</button><button data-a="unique">Unique Lines</button><button data-a="trim">Trim Lines</button><button data-a="spaces">Fix Spaces</button><button data-a="slug">URL Slug</button><button data-a="camel">camelCase</button><button data-a="snake">snake_case</button><button data-a="kebab">kebab-case</button></div><div class="row">Line ending<select id="ending"><option value="keep">Keep</option><option value="lf">LF (Unix)</option><option value="crlf">CRLF (Windows)</option></select></div><div class="row">Prefix every line<input id="prefix" placeholder="> "></div><div class="row">Suffix every line<input id="suffix" placeholder=";"></div><div class="buttons"><button id="applyLines">APPLY LINES</button><button id="swap">⇄ SWAP</button><button id="copy">COPY OUTPUT</button><button id="download">SAVE TXT</button></div></div></section><section class="out"><div class="panel"><h2>OUTPUT.TXT</h2><textarea id="output" readonly></textarea></div></section></div><div class="status" id="status">Everything runs locally in your browser. 0 chars · 0 words · 0 lines</div></main><script>(()=>{'use strict';const $=i=>document.getElementById(i),I=$('input'),O=$('output'),T=$('status');function words(s){return(s.trim().match(/\S+/g)||[]).length}function stat(){let s=I.value;T.textContent='Everything runs locally in your browser. '+s.length+' chars · '+words(s)+' words · '+(s? s.split(/\r?\n/).length:0)+' lines'}function title(s){return s.toLowerCase().replace(/(^|\s|[-_/])([a-zà-ž])/g,(m,a,b)=>a+b.toUpperCase())}function tokens(s){return s.trim().replace(/([a-z])([A-Z])/g,'$1 $2').toLowerCase().split(/[^a-z0-9à-ž]+/i).filter(Boolean)}function apply(a){let s=I.value,r=s;if(a==='upper')r=s.toUpperCase();if(a==='lower')r=s.toLowerCase();if(a==='title')r=title(s);if(a==='sentence')r=s.toLowerCase().replace(/(^\s*|[.!?]\s+)([a-zà-ž])/g,(m,a,b)=>a+b.toUpperCase());if(a==='reverse')r=[...s].reverse().join('');if(a==='lines')r=s.split(/\r?\n/).reverse().join('\n');if(a==='sort')r=s.split(/\r?\n/).sort((a,b)=>a.localeCompare(b)).join('\n');if(a==='unique')r=[...new Set(s.split(/\r?\n/))].join('\n');if(a==='trim')r=s.split(/\r?\n/).map(x=>x.trim()).join('\n');if(a==='spaces')r=s.replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').trim();if(a==='slug')r=tokens(s).join('-');if(a==='camel'){let q=tokens(s);r=(q.shift()||'')+q.map(x=>x[0].toUpperCase()+x.slice(1)).join('')}if(a==='snake')r=tokens(s).join('_');if(a==='kebab')r=tokens(s).join('-');O.value=r;outStat()}function outStat(){let s=O.value;T.textContent='Output: '+s.length+' chars · '+words(s)+' words · '+(s?s.split(/\r?\n/).length:0)+' lines'}document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>apply(b.dataset.a));I.oninput=stat;$('applyLines').onclick=()=>{let e=$('ending').value,p=$('prefix').value,s=$('suffix').value,lines=I.value.split(/\r?\n/).map(x=>p+x+s),sep=e==='crlf'?'\r\n':'\n';O.value=lines.join(sep);outStat()};$('swap').onclick=()=>{let s=I.value;I.value=O.value;O.value=s;stat()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(O.value);T.textContent='Copied output to clipboard.'}catch(e){O.select();document.execCommand('copy')}};$('download').onclick=()=>{let b=new Blob([O.value],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='transformed.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};stat()})();</script></body></html>
