<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><meta name="description" content="Interactive CSS border-radius designer with elliptical corners, presets and copyable code."><title>🟪 Radius Craft 98 · Playground</title><link rel="canonical" href="https://mrhakan.github.io/apps/radius-craft/"><meta property="og:title" content="🟪 Radius Craft 98"><meta property="og:description" content="Interactive CSS border-radius designer with elliptical corners, presets and copyable code."><style>*{box-sizing:border-box}html{background:#008080;min-height:100%}body{margin:0;padding:14px;font:14px Tahoma,Verdana,sans-serif;color:#213448}.window{max-width:1000px;margin:auto;background:#c0c0c0;border:2px solid;border-color:#fff #555 #555 #fff;box-shadow:7px 7px #005757;padding:4px}.title{background:linear-gradient(90deg,#000080,#187cae);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px;gap:10px}h1{font-size:20px;margin:0}.close{background:#c0c0c0;color:#123;padding:8px;text-decoration:none;border:2px solid;border-color:#fff #555 #555 #fff}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(230px,.8fr);gap:12px;padding:12px}.panel{background:#eee;border:2px inset #ddd;padding:14px;min-width:0}button,input,select,textarea{font:inherit}button,select{padding:9px;min-height:42px;background:#c0c0c0;border:2px solid;border-color:#fff #555 #555 #fff;cursor:pointer;color:#123}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #f90;outline-offset:2px}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}label{display:block;margin:10px 0;font-weight:bold}input{width:100%;padding:8px}#status{background:#fff;padding:12px;border:2px inset #ddd;min-height:46px;line-height:1.5}p{line-height:1.6}footer{padding:10px 12px;border-top:1px solid #888;font-size:12px}@media(max-width:650px){body{padding:7px}.layout{grid-template-columns:1fr}.title h1{font-size:17px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}} .preview{display:grid;place-items:center;min-height:310px;background:repeating-conic-gradient(#d7dce1 0% 25%,#fff 0% 50%) 50%/28px 28px;border:2px inset #aaa;overflow:hidden}#shape{height:240px;display:grid;place-items:center;text-align:center;color:white;font-size:32px;font-weight:bold;text-shadow:0 2px 3px #3336;transition:border-radius .12s}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:15px;border:2px inset #ddd}input[type=range]{accent-color:#164b93}input[type=color]{max-width:90px;height:45px;padding:2px}#horizontal label,#vertical label{font-size:12px;font-weight:normal;margin:8px 0}@media(max-width:650px){.preview{min-height:250px}#shape{height:190px}}</style></head><body><main class="window"><header class="title"><h1>🟪 Radius Craft 98</h1><a class="close" href="../../" aria-label="Back to Playground">✕ Close</a></header><div class="layout"><section class="panel"><h2>Live preview</h2><div class="preview"><div id="shape" role="img" aria-label="Preview of the configured rounded shape"><span>Radius<br>Craft</span></div></div><h3>Generated CSS</h3><pre id="code" tabindex="0"></pre><div class="actions"><button id="copy" type="button">Copy CSS</button><button id="reset" type="button">Reset</button></div><p id="status" role="status" aria-live="polite"></p></section><aside class="panel"><h2>Corner editor</h2><label for="preset">Preset</label><select id="preset"><option value="custom">Custom</option><option value="soft">Soft corners</option><option value="pill">Pill</option><option value="blob">Organic blob</option><option value="cut">Asymmetric</option></select><p>Horizontal radii (%)</p><div id="horizontal"></div><p>Vertical radii (%)</p><div id="vertical"></div><label for="fill">Fill color</label><input id="fill" type="color" value="#6e5ce7"><label for="width">Preview width (%)</label><input id="width" type="range" min="40" max="100" value="78"><p>Use the CSS shorthand slash to set independent horizontal and vertical radii. Everything stays local.</p></aside></div><footer>Playground · Works entirely in your browser. No tracking or accounts.</footer></main><script>'use strict';

const $=id=>document.getElementById(id),labels=['Top left','Top right','Bottom right','Bottom left'];let h=[24,24,24,24],v=[24,24,24,24];const presets={soft:[[18,18,18,18],[18,18,18,18]],pill:[[50,50,50,50],[50,50,50,50]],blob:[[70,30,65,25],[35,70,25,65]],cut:[[5,60,5,60],[60,5,60,5]]};
function controls(){for(const [id,arr] of [['horizontal',h],['vertical',v]]){const root=$(id);root.replaceChildren();arr.forEach((value,i)=>{const label=document.createElement('label'),text=document.createElement('span'),input=document.createElement('input');input.type='range';input.min='0';input.max='100';input.value=value;text.textContent=labels[i]+': '+value+'%';input.setAttribute('aria-label',labels[i]+' '+id+' radius');input.addEventListener('input',()=>{arr[i]=Number(input.value);text.textContent=labels[i]+': '+arr[i]+'%';$('preset').value='custom';render()});label.append(text,input);root.append(label)})}}
function render(){const radius=h.join('% ')+'% / '+v.join('% ')+'%';const fill=$('fill').value;$('shape').style.borderRadius=radius;$('shape').style.background=fill;$('shape').style.width=$('width').value+'%';$('code').textContent='border-radius: '+radius+';\nbackground: '+fill+';';}
$('preset').addEventListener('change',()=>{const p=presets[$('preset').value];if(!p)return;h=p[0].slice();v=p[1].slice();controls();render()});$('fill').addEventListener('input',render);$('width').addEventListener('input',render);
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('code').textContent);$('status').textContent='CSS copied.'}catch{$('status').textContent='Clipboard unavailable; select the CSS above.'}});
$('reset').addEventListener('click',()=>{h=[24,24,24,24];v=h.slice();$('preset').value='custom';$('fill').value='#6e5ce7';$('width').value='78';controls();render();$('status').textContent='Reset.'});controls();render();
</script></body></html>
