<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><title>Base64 Lab 98</title><meta name="description" content="Encode and decode UTF-8 text or local files as Base64 entirely in your browser."><link rel="canonical" href="https://mrhakan.github.io/apps/base64-lab/"><meta property="og:title" content="Base64 Lab 98"><meta property="og:description" content="Private local Base64 encoding and decoding for text and files."><meta property="og:type" content="website"><meta property="og:url" content="https://mrhakan.github.io/apps/base64-lab/"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080}body{min-height:100vh;display:grid;place-items:center;padding:12px}.win{width:min(820px,100%);background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:7px 7px #004040;padding:3px}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:6px 8px;display:flex;justify-content:space-between}.title a{color:#000;background:#c0c0c0;text-decoration:none;padding:0 6px;border:2px solid;border-color:#fff #444 #444 #fff}.body{padding:12px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-weight:bold;font-size:12px}textarea{width:100%;min-height:250px;margin-top:5px;resize:vertical;border:2px inset #ddd;background:#fff;padding:8px;font:13px/1.4 Consolas,monospace}.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.btn,.file{background:#c0c0c0;border:2px solid;border-color:#fff #444 #444 #fff;padding:7px 11px;font-weight:bold;min-height:36px;cursor:pointer}.file input{display:none}.status{background:#ffffe1;border:1px solid #808080;padding:8px;font:12px monospace;min-height:34px}.note{font-size:12px;line-height:1.4}:where(a,button,.file,textarea):focus-visible{outline:2px solid #f0f;outline-offset:2px}@media(max-width:650px){body{padding:5px}.body{padding:8px}.cols{grid-template-columns:1fr}textarea{min-height:180px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main class="win"><div class="title"><span>64 BASE64 LAB 98.EXE</span><a href="../../" aria-label="Back to Playground">×</a></div><div class="body"><div class="cols"><label>TEXT / UTF-8<textarea id="plain" spellcheck="false" placeholder="Type or paste text here…"></textarea></label><label>BASE64<textarea id="encoded" spellcheck="false" placeholder="Base64 output or input…"></textarea></label></div><div class="bar"><button type="button" class="btn" id="enc">ENCODE →</button><button type="button" class="btn" id="dec">← DECODE</button><button type="button" class="btn" id="copy">COPY BASE64</button><button type="button" class="btn" id="clear">CLEAR</button><label class="file" tabindex="0">LOAD FILE<input id="file" type="file"></label></div><div id="status" class="status" role="status" aria-live="polite">Ready. Everything stays in this browser tab.</div><p class="note">UTF-8 safe text conversion uses native browser APIs. Loading a file produces its raw Base64 payload locally; no upload, account, API or tracking is involved.</p></div></main><script>(()=>{'use strict';const p=document.getElementById('plain'),e=document.getElementById('encoded'),s=document.getElementById('status');function to64(t){const bytes=new TextEncoder().encode(t);let x='';for(let i=0;i<bytes.length;i+=8192)x+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(x)}function from64(t){const raw=atob(t.replace(/\s/g,'')),a=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);return new TextDecoder('utf-8',{fatal:true}).decode(a)}document.getElementById('enc').onclick=()=>{try{e.value=to64(p.value);s.textContent=`Encoded ${new TextEncoder().encode(p.value).length} bytes.`}catch(x){s.textContent='Encode error: '+x.message}};document.getElementById('dec').onclick=()=>{try{p.value=from64(e.value);s.textContent='Decoded valid UTF-8 Base64.'}catch(x){s.textContent='Decode error: check Base64 and UTF-8 input.'}};document.getElementById('copy').onclick=async()=>{if(!e.value)return s.textContent='Nothing to copy.';try{await navigator.clipboard.writeText(e.value);s.textContent='Base64 copied to clipboard.'}catch{xFallback()} };function xFallback(){e.select();document.execCommand('copy');s.textContent='Base64 copied.'}document.getElementById('clear').onclick=()=>{p.value=e.value='';s.textContent='Cleared.'};document.getElementById('file').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{e.value=String(r.result).split(',')[1]||'';p.value='';s.textContent=`Loaded ${f.name} · ${f.size.toLocaleString()} bytes locally.`};r.readAsDataURL(f)};})();</script></body></html>
