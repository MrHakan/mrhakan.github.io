<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><title>Clamp Lab 98</title><meta name="description" content="Generate responsive CSS clamp values visually and copy production-ready fluid sizing CSS."><link rel="canonical" href="https://mrhakan.github.io/apps/clamp-lab/"><meta property="og:title" content="Clamp Lab 98"><meta property="og:description" content="Build responsive CSS clamp values locally with a live preview."><meta property="og:type" content="website"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080}body{min-height:100vh;display:grid;place-items:center;padding:10px}.win{width:min(760px,100%);background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:7px 7px #004040;padding:3px}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:6px;display:flex;justify-content:space-between}.title h1{margin:0;font:inherit}.title a{color:#000;background:#c0c0c0;text-decoration:none;padding:0 6px;border:2px solid;border-color:#fff #444 #444 #fff}.body{padding:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field{display:grid;gap:4px;font:bold 12px monospace}.field input{width:100%;padding:7px;border:2px inset #ddd;font:14px monospace}.preview{margin:12px 0;background:#fff;border:2px inset #ddd;padding:18px;min-height:130px;overflow:hidden}.preview p{margin:0;line-height:1.15;white-space:nowrap}.code{background:#000;color:#0f0;border:2px inset #ddd;padding:10px;font:13px/1.5 monospace;overflow-wrap:anywhere;min-height:58px}.actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}.btn{background:#c0c0c0;border:2px solid;border-color:#fff #444 #444 #fff;padding:8px 12px;font-weight:bold}.status{margin-top:8px;background:#fff;border:2px inset #ddd;padding:7px;font:12px monospace;min-height:32px}:where(a,button,input):focus-visible{outline:2px solid #f0f;outline-offset:2px}@media(max-width:520px){body{padding:4px}.body{padding:7px}.grid{grid-template-columns:1fr}.preview p{white-space:normal}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main class="win"><div class="title"><h1>📐 CLAMP LAB 98.EXE</h1><a href="../../" aria-label="Back to Playground">×</a></div><div class="body"><div class="grid"><label class="field">MIN SIZE (px)<input id="minS" type="number" min="1" value="18"></label><label class="field">MAX SIZE (px)<input id="maxS" type="number" min="1" value="48"></label><label class="field">MIN VIEWPORT (px)<input id="minV" type="number" min="1" value="320"></label><label class="field">MAX VIEWPORT (px)<input id="maxV" type="number" min="1" value="1200"></label></div><div class="preview"><p id="sample">Fluid type that fits every window.</p></div><div class="code" id="code"></div><div class="actions"><button type="button" class="btn" id="copy">COPY CSS</button><button type="button" class="btn" id="preset">TYPE PRESET</button></div><div class="status" id="status" aria-live="polite">Edit the four values to generate a fluid clamp().</div></div></main><script>(()=>{'use strict';const ids=['minS','maxS','minV','maxV'],els=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)])),code=document.getElementById('code'),sample=document.getElementById('sample'),status=document.getElementById('status');let css='';function update(){const a=+els.minS.value,b=+els.maxS.value,c=+els.minV.value,d=+els.maxV.value;if(!(a>0&&b>a&&c>0&&d>c)){css='Enter values where max size > min size and max viewport > min viewport.';code.textContent=css;status.textContent='Those ranges are not valid yet.';return}const slope=(b-a)/(d-c)*100,intercept=a-slope*c/100,mid=`${intercept.toFixed(3)}px + ${slope.toFixed(3)}vw`;css=`font-size: clamp(${a}px, ${mid}, ${b}px);`;code.textContent=css;sample.style.fontSize=`clamp(${a}px, ${mid}, ${b}px)`;status.textContent=`Scales from ${a}px at ${c}px viewport to ${b}px at ${d}px viewport.`}ids.forEach(id=>els[id].addEventListener('input',update));document.getElementById('copy').onclick=async()=>{if(!css.startsWith('font-size'))return;try{await navigator.clipboard.writeText(css);status.textContent='CSS copied to clipboard.'}catch{status.textContent='Clipboard unavailable; select the CSS above manually.'}};document.getElementById('preset').onclick=()=>{els.minS.value=16;els.maxS.value=40;els.minV.value=360;els.maxV.value=1440;update()};update()})();</script></body></html>
