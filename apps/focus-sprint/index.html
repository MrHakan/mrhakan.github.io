<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><meta name="description" content="Offline focus timer with tasks, breaks and daily statistics."><title>Focus Sprint 98</title><link rel="canonical" href="https://mrhakan.github.io/apps/focus-sprint/"><meta property="og:title" content="Focus Sprint 98"><meta property="og:description" content="Private focus timer with tasks and local progress."><style>:where(button,input,a):focus-visible{outline:3px solid #f0f;outline-offset:3px}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style><link rel="stylesheet" href="style.css"></head><body><main class="win"><header class="title"><h1>FOCUS SPRINT 98.EXE</h1><a href="../../" aria-label="Back to Playground">×</a></header><div class="layout"><section class="panel"><h2>TIMEBOX CONSOLE</h2><div class="modes"><button type="button" class="btn" data-phase="focus" aria-pressed="true">FOCUS</button><button type="button" class="btn" data-phase="short" aria-pressed="false">SHORT BREAK</button><button type="button" class="btn" data-phase="long" aria-pressed="false">LONG BREAK</button></div><div class="timer" id="ring" role="img" aria-label="Timer progress"><div class="timer-inner"><div id="phase">FOCUS</div><div id="clock">25:00</div><div id="activeTask">Select a task</div></div></div><div class="actions"><button type="button" class="btn" id="toggle">▶ START</button><button type="button" class="btn" id="reset">↻ RESET</button><button type="button" class="btn" id="skip">NEXT PHASE »</button></div><div id="status" role="status" aria-live="polite">Ready to focus.</div><div class="settings"><label>FOCUS MIN<input type="number" id="focusMin" min="1" max="180" value="25"></label><label>SHORT MIN<input type="number" id="shortMin" min="1" max="90" value="5"></label><label>LONG MIN<input type="number" id="longMin" min="1" max="120" value="15"></label></div><p>After four focus rounds, take a long break. Phases never auto-start.</p></section><section class="panel"><h2>TASK QUEUE</h2><form id="taskForm"><input id="taskInput" maxlength="90" placeholder="What will you work on?" aria-label="New task" required><button type="submit" class="btn">+ ADD</button></form><ul id="tasks" aria-label="Focus tasks"></ul><p id="empty">No tasks yet.</p><h2>TODAY'S LOG</h2><div class="stats"><span class="badge">ROUNDS <b id="todayRounds">0</b></span><span class="badge">MINUTES <b id="todayMinutes">0</b></span><span class="badge">ALL <b id="allRounds">0</b></span></div><p>Private browser storage; export or import a JSON backup.</p><div class="actions"><button type="button" class="btn" id="export">EXPORT</button><label class="btn" for="import">IMPORT</label><input type="file" id="import" accept=".json,application/json" hidden><button type="button" class="btn" id="clearDone">CLEAR DONE</button></div></section></div></main><script src="core.js"></script><script src="tasks.js"></script></body></html>
