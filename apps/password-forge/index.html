<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><title>Password Forge 98</title><meta name="description" content="Generate strong random passwords locally with Web Crypto and an entropy estimate."><link rel="canonical" href="https://mrhakan.github.io/apps/password-forge/"><meta property="og:title" content="Password Forge 98"><meta property="og:description" content="Forge random passwords entirely in your browser with Web Crypto."><meta property="og:type" content="website"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;background:#008080}body{min-height:100vh;display:grid;place-items:center;padding:8px}.win{width:min(680px,100%);background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:7px 7px #004040;padding:3px}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:6px;display:flex;justify-content:space-between}.title h1{margin:0;font:inherit}.title a{color:#000;background:#c0c0c0;text-decoration:none;padding:0 6px;border:2px solid;border-color:#fff #444 #444 #fff}.body{padding:12px}.output{background:#fff;border:2px inset #ddd;padding:12px;font:bold 18px/1.4 monospace;overflow-wrap:anywhere;min-height:54px}.row{display:flex;gap:9px;align-items:center;margin:10px 0;flex-wrap:wrap}.row input[type=range]{flex:1;min-width:180px}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.check{background:#ddd;border:1px solid #999;padding:7px;font:13px monospace}.btn{background:#c0c0c0;border:2px solid;border-color:#fff #444 #444 #fff;padding:9px 13px;font-weight:bold;cursor:pointer}.meter{height:18px;background:#fff;border:2px inset #ddd;margin:10px 0}.meter span{display:block;height:100%;background:#000080;width:0}.status{background:#fff;border:2px inset #ddd;padding:7px;font:12px monospace;min-height:32px}:where(a,button,input):focus-visible{outline:2px solid #f0f;outline-offset:2px}@media(max-width:480px){body{padding:3px}.body{padding:7px}.checks{grid-template-columns:1fr}.output{font-size:15px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main class="win"><div class="title"><h1>🔑 PASSWORD FORGE 98.EXE</h1><a href="../../" aria-label="Back to Playground">×</a></div><div class="body"><div class="output" id="out" aria-label="Generated password"></div><div class="row"><label for="len"><b>LENGTH: <span id="lv">20</span></b></label><input id="len" type="range" min="8" max="64" value="20"></div><div class="checks"><label class="check"><input type="checkbox" id="lower" checked> lowercase a-z</label><label class="check"><input type="checkbox" id="upper" checked> UPPERCASE A-Z</label><label class="check"><input type="checkbox" id="nums" checked> numbers 0-9</label><label class="check"><input type="checkbox" id="symbols" checked> symbols !@#$…</label></div><div class="meter" aria-hidden="true"><span id="bar"></span></div><div class="row"><button type="button" class="btn" id="gen">GENERATE</button><button type="button" class="btn" id="copy">COPY</button></div><div class="status" id="status" aria-live="polite">Generated locally. Nothing is sent anywhere.</div></div></main><script>(()=>{'use strict';const sets={lower:'abcdefghijklmnopqrstuvwxyz',upper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',nums:'0123456789',symbols:'!@#$%^&*()-_=+[]{};:,.?'},ids=['lower','upper','nums','symbols'],out=document.getElementById('out'),len=document.getElementById('len'),lv=document.getElementById('lv'),bar=document.getElementById('bar'),status=document.getElementById('status');function random(max){if(max<1)return 0;const lim=256-256%max,a=new Uint8Array(1);do crypto.getRandomValues(a);while(a[0]>=lim);return a[0]%max}function generate(){let chars='',required=[];ids.forEach(id=>{if(document.getElementById(id).checked){chars+=sets[id];required.push(sets[id])}});if(!chars){status.textContent='Select at least one character set.';out.textContent='—';bar.style.width='0';return}const n=+len.value,p=Array.from({length:n},()=>chars[random(chars.length)]);required.forEach((s,i)=>{if(i<n)p[i]=s[random(s.length)]});for(let i=p.length-1;i>0;i--){const j=random(i+1);[p[i],p[j]]=[p[j],p[i]]}out.textContent=p.join('');const bits=Math.floor(n*Math.log2(chars.length));bar.style.width=Math.min(100,bits/1.28)+'%';status.textContent=`Approx. ${bits} bits of search-space entropy · Web Crypto random source · local only.`}len.oninput=()=>{lv.textContent=len.value;generate()};ids.forEach(id=>document.getElementById(id).onchange=generate);document.getElementById('gen').onclick=generate;document.getElementById('copy').onclick=async()=>{if(out.textContent==='—')return;try{await navigator.clipboard.writeText(out.textContent);status.textContent='Password copied to clipboard.'}catch{status.textContent='Clipboard unavailable; select the password manually.'}};generate()})();</script></body></html>
